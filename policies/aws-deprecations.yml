# ========================================
# AWS Service Deprecations & EOL Versions
# ========================================
#
# This policy file contains rules for detecting AWS services, runtimes, and
# versions that are deprecated, approaching EOL, or incurring extended support charges.
#
# Categories:
# - deprecation: Runtime/version scheduled for deprecation
# - eol: End of life, no longer supported
# - extended-support: Still works but incurs additional charges
# ========================================

policies:
  # ========================================
  # ⚡ LAMBDA RUNTIME DEPRECATIONS
  # ========================================

  - name: leftsize-lambda-deprecated-runtime
    description: |
      Find Lambda functions using deprecated or soon-to-be-deprecated runtimes.
      
      Fully blocked (Phase 2 — can't create or update):
      - Python 3.8: Blocked Feb 2025
      - Node.js 16.x: Blocked Sep 2024
      - .NET 6: Blocked Feb 2025
      - Java 11: Blocked Feb 2025
      - Node.js 18.x: Blocked Nov 2025
      - Python 3.9: Blocked Nov 2025
      
      Deprecating soon (Phase 1 approaching):
      - Ruby 3.2: Phase 1 Apr 2026, Phase 2 May 2026
      - Node.js 20.x: Phase 1 May 2026, Phase 2 Jun 2026
      - Python 3.10: Phase 1 Nov 2026, Phase 2 Dec 2026
      - Java 17: Phase 1 Nov 2026, Phase 2 Dec 2026
      
      Reference: https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html
    resource: aws.lambda
    filters:
      # Match deprecated runtimes
      - type: value
        key: 'Runtime'
        op: in
        value:
          # Fully blocked (Phase 2 past)
          - 'python3.8'
          - 'nodejs16.x'
          - 'dotnet6'
          - 'java11'
          - 'nodejs18.x'
          - 'python3.9'
          # Deprecating soon (2026)
          - 'ruby3.2'
          - 'nodejs20.x'
          - 'python3.10'
          - 'java17'
          # Very old (should have been migrated long ago)
          - 'python3.7'
          - 'python3.6'
          - 'python2.7'
          - 'nodejs14.x'
          - 'nodejs12.x'
          - 'nodejs10.x'
          - 'dotnetcore3.1'
          - 'java8'
          - 'java8.al2'
          - 'go1.x'
          - 'ruby2.7'
    actions:
      - type: mark-for-op
        op: tag
        days: 7
        tag: leftsize-lambda-runtime-upgrade

  # ========================================
  # 🗄️ ELASTICACHE VERSION DEPRECATIONS
  # ========================================

  - name: leftsize-elasticache-eol-redis
    description: |
      Find ElastiCache Redis clusters running EOL or deprecated versions.
      
      Redis version support:
      - Redis 6.x: Still in standard support (flag only 5.x and older)
      - Redis 5.x: Legacy, should upgrade
      - Redis 4.x and below: Very old, critical to upgrade
      
      Redis 7.x provides better performance and new features.
      
      Reference: https://docs.aws.amazon.com/AmazonElastiCache/latest/red-ug/supported-engine-versions.html
    resource: aws.cache-cluster
    filters:
      # Redis engine only
      - type: value
        key: 'Engine'
        value: 'redis'
      # Match older Redis versions (5.x and below; Redis 6.x still supported)
      - type: value
        key: 'EngineVersion'
        op: regex
        value: '^[1-5]\.'
    actions:
      - type: mark-for-op
        op: tag
        days: 14
        tag: leftsize-elasticache-upgrade

  # ========================================
  # 🔍 OPENSEARCH/ELASTICSEARCH DEPRECATIONS
  # ========================================

  - name: leftsize-opensearch-outdated-version
    description: |
      Find OpenSearch/Elasticsearch domains running outdated versions.
      
      Version guidance:
      - Elasticsearch 7.x and below: Migrate to OpenSearch 2.x
      - OpenSearch 1.x: Upgrade to OpenSearch 2.x for better performance
      
      OpenSearch 2.x provides significant performance improvements,
      security enhancements, and new features.
      
      Reference: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/version-migration.html
    resource: aws.elasticsearch
    filters:
      # Match older versions
      - or:
        # Legacy Elasticsearch versions
        - type: value
          key: 'ElasticsearchVersion'
          op: regex
          value: '^[1-7]\.'
        # OpenSearch 1.x
        - type: value
          key: 'EngineVersion'
          op: regex
          value: '^OpenSearch_1\.'
    actions:
      - type: mark-for-op
        op: tag
        days: 14
        tag: leftsize-opensearch-upgrade

  # ========================================
  # ☸️ EKS KUBERNETES VERSION DEPRECATIONS
  # ========================================

  - name: leftsize-eks-outdated-version
    description: |
      Find EKS clusters running outdated Kubernetes versions incurring extended support charges.
      
      CRITICAL COST IMPACT:
      - Extended support costs 6X MORE than standard support
      - Standard: $0.10/cluster/hour (~$73/month)
      - Extended: $0.60/cluster/hour (~$438/month)
      - Potential savings: $365/month per cluster ($4,380/year)
      
      EKS Version Support Timeline (as of Feb 2026):
      
      | Version | Standard Support | Extended Support | Status |
      |---------|------------------|------------------|--------|
      | 1.27    | Ended Jan 2025   | Ends Jul 2025    | EXPIRED |
      | 1.28    | Ended Mar 2025   | Ends Nov 2025    | EXPIRED |
      | 1.29    | Ended Mar 2025   | Ends Mar 2026    | Extended (6X cost) |
      | 1.30    | Ended Jul 2025   | Ends Jul 2026    | Extended (6X cost) |
      | 1.31    | Ended Nov 2025   | Ends Nov 2026    | Extended (6X cost) |
      | 1.32    | Ends Mar 2026    | Ends Mar 2027    | Standard (upgrade soon) |
      | 1.33+   | Active           | -                | Current |
      
      AWS auto-upgrades clusters when extended support ends if upgrade policy is disabled.
      
      Reference: https://docs.aws.amazon.com/eks/latest/userguide/kubernetes-versions.html
    resource: aws.eks
    filters:
      # Match Kubernetes versions in extended support or approaching it
      - type: value
        key: 'version'
        op: in
        value:
          # Extended support EXPIRED - critical upgrade needed
          - '1.23'
          - '1.24'
          - '1.25'
          - '1.26'
          - '1.27'
          - '1.28'
          # Currently in EXTENDED SUPPORT (6X cost)
          - '1.29'
          - '1.30'
          - '1.31'
          # Standard support ending Mar 2026
          - '1.32'
    actions:
      - type: mark-for-op
        op: tag
        days: 14
        tag: leftsize-eks-upgrade

  # ========================================
  # 📌 AMAZON PINPOINT DEPRECATION
  # ========================================

  - name: leftsize-pinpoint-deprecated
    description: |
      Find Amazon Pinpoint applications that need migration before service shutdown.
      
      CRITICAL: Amazon Pinpoint is being discontinued.
      
      Timeline:
      - May 20, 2025: No longer accepting new customers
      - October 30, 2026: Service END OF LIFE - all access removed
      
      After October 30, 2026, you will lose access to:
      - Amazon Pinpoint console
      - All Pinpoint resources (endpoints, segments, campaigns, journeys, analytics)
      
      Migration Options:
      - Engagement features → Amazon SNS + Amazon SES
      - SMS messaging → Amazon SNS SMS
      - Email campaigns → Amazon SES
      - Push notifications → Amazon SNS Mobile Push
      - Analytics → Amazon CloudWatch + custom dashboards
      
      Reference: https://aws.amazon.com/pinpoint/
    resource: aws.pinpoint-app
    filters:
      # Match all Pinpoint applications - the entire service is deprecated
      - type: value
        key: 'Id'
        op: not-equal
        value: ''
    actions:
      - type: mark-for-op
        op: tag
        days: 30
        tag: leftsize-pinpoint-migration

  # ========================================
  # ⏱️ AMAZON TIMESTREAM LIVEANALYTICS DEPRECATION
  # ========================================

  - name: leftsize-timestream-deprecated
    description: |
      Find Amazon Timestream for LiveAnalytics databases that need migration.
      
      IMPORTANT: Amazon Timestream for LiveAnalytics is being deprecated.
      
      Timeline:
      - June 20, 2025: No longer accepting new customers
      - Future: Service will be discontinued (exact date TBD)
      
      AWS Recommended Migration:
      - Amazon Timestream for InfluxDB (similar functionality)
      - Amazon Managed Service for Prometheus (for metrics)
      - Amazon OpenSearch Service (for time-series analytics)
      
      Timestream for InfluxDB offers:
      - InfluxDB-compatible API
      - Better ecosystem support
      - Similar time-series capabilities
      
      Reference: https://aws.amazon.com/timestream/
    resource: aws.timestream-database
    filters:
      # Match all Timestream databases - the service variant is deprecated
      - type: value
        key: 'DatabaseName'
        op: not-equal
        value: ''
    actions:
      - type: mark-for-op
        op: tag
        days: 30
        tag: leftsize-timestream-migration

  # ========================================
  # 📝 TEMPLATE FOR FUTURE DEPRECATIONS
  # ========================================
