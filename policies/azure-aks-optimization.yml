policies:
  # ========================================
  # ☸️ AZURE KUBERNETES SERVICE (AKS)
  # ========================================
  # These policies are separated from general Azure optimizations
  # because not all organizations use Kubernetes/AKS
  
  - name: leftsize-overprovisioned-aks-nodes
    description: |
      Find running AKS clusters whose nodes averaged under 20% CPU and under 40%
      memory (working set) over the last 7 days.

      Uses the AKS platform metrics node_cpu_usage_percentage and
      node_memory_working_set_percentage (no Container Insights needed), averaged
      over all nodes. Clusters without metric data are skipped.

      Reference: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/supported-metrics/microsoft-containerservice-managedclusters-metrics
    resource: azure.aks
    filters:
      # Only running clusters
      - type: value
        key: 'properties.powerState.code'
        value: 'Running'
      # Has at least one agent pool
      - type: value
        key: 'properties.agentPoolProfiles'
        value: present
      # Low node CPU over 7 days (metric time grains go up to PT12H)
      - type: metric
        metric: 'node_cpu_usage_percentage'
        aggregation: 'average'
        timeframe: 168  # hours (7 days) — c7n-azure metric timeframe is in hours
        interval: 'PT12H'
        op: 'lt'
        threshold: 20.0
      # Low node memory over 7 days (memory is usually what limits pod packing)
      - type: metric
        metric: 'node_memory_working_set_percentage'
        aggregation: 'average'
        timeframe: 168
        interval: 'PT12H'
        op: 'lt'
        threshold: 40.0
    metadata:
      category: cost-optimization
      tier: free

  - name: leftsize-aks-cluster-autoscaler-disabled
    description: "Find AKS clusters without cluster autoscaler enabled"
    resource: azure.aks
    filters:
      # Only running clusters
      - type: value
        key: 'properties.powerState.code'
        value: 'Running'
      # Cluster autoscaler is enabled on none of the node pools
      - type: value
        key: "length(properties.agentPoolProfiles[?enableAutoScaling] || `[]`)"
        value: 0
      # Exclude very small clusters (fewer than 3 nodes across all pools)
      - type: value
        key: "sum(properties.agentPoolProfiles[].count || `[]`)"
        op: 'gte'
        value: 3
    actions:
      - type: tag
        tag: leftsize-aks-enable-autoscaler
        value: 'consider-enabling-cluster-autoscaler'
    metadata:
      category: cost-optimization
      tier: free

  - name: leftsize-aks-using-expensive-vm-sizes
    description: "Find AKS node pools using expensive VM sizes that could be optimized"
    resource: azure.aks
    filters:
      # Only running clusters
      - type: value
        key: 'properties.powerState.code'
        value: 'Running'
      # Check for expensive VM series in node pools
      # Any node pool on one of these sizes
      - type: value
        key: 'properties.agentPoolProfiles[].vmSize'
        op: 'intersect'
        value: 
          # Memory-optimized (often overkill for general workloads)
          - 'Standard_E4s_v3'
          - 'Standard_E8s_v3'
          - 'Standard_E16s_v3'
          - 'Standard_E32s_v3'
          # Older generation compute-optimized
          - 'Standard_F8s'
          - 'Standard_F16s'
          # Large general-purpose (often over-provisioned)
          - 'Standard_D8s_v3'
          - 'Standard_D16s_v3'
          - 'Standard_D32s_v3'
    actions:
      - type: tag
        tag: leftsize-aks-expensive-vms
        value: 'review-vm-size-optimization'
    metadata:
      category: cost-optimization
      tier: free

  - name: leftsize-aks-dev-clusters-always-running
    description: "Find non-production AKS clusters running 24/7"
    resource: azure.aks
    filters:
      # Only running clusters
      - type: value
        key: 'properties.powerState.code'
        value: 'Running'
      # Tagged as dev/test/staging (tag values compared case-insensitively)
      - or:
        - type: value
          key: 'tags.Environment'
          value_type: normalize
          op: 'in'
          value: ['dev', 'development', 'test', 'testing', 'staging', 'qa', 'sandbox']
        - type: value
          key: 'tags.environment'
          value_type: normalize
          op: 'in'
          value: ['dev', 'development', 'test', 'testing', 'staging', 'qa', 'sandbox']
        - type: value
          key: 'tags.Env'
          value_type: normalize
          op: 'in'
          value: ['dev', 'development', 'test', 'testing', 'staging', 'qa', 'sandbox']
        - type: value
          key: 'tags.env'
          value_type: normalize
          op: 'in'
          value: ['dev', 'development', 'test', 'testing', 'staging', 'qa', 'sandbox']
    actions:
      - type: tag
        tag: leftsize-aks-dev-always-on
        value: 'consider-start-stop-schedule'
    metadata:
      category: cost-optimization
      tier: free
