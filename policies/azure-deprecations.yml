# ========================================
# Azure Service Deprecations & Retirements
# ========================================
#
# This policy file contains rules for detecting Azure services, SKUs, and 
# features that are scheduled for deprecation or retirement by Microsoft.
#
# These are NOT cost optimization rules - they are mandatory migrations
# required to maintain service continuity.
#
# Category: deprecation, breaking-change, migration-required
# ========================================

policies:
  # ========================================
  # 🖥️ VIRTUAL MACHINE DEPRECATIONS
  # ========================================
  
  - name: leftsize-nvv4-series-retirement
    description: |
      Detect NVv4-series VMs scheduled for retirement on September 30, 2026.
      
      Microsoft is retiring the following VM sizes:
      - Standard_NV4as_v4, Standard_NV4ahs_v4
      - Standard_NV8as_v4, Standard_NV8ahs_v4
      - Standard_NV16as_v4, Standard_NV16ahs_v4
      - Standard_NV32as_v4, Standard_NV32ahs_v4
      
      Recommended migration: NVads_V710_v5-series
      - Greater GPU memory bandwidth per GPU
      - Better support for graphics applications, virtual desktops, and visualizations
      - Improved AI inference workload performance
      
      Timeline:
      - September 30, 2025: Last day for Reserved Instance purchases
      - April 2026: Microsoft fix for resize operation error expected
      - September 30, 2026: RETIREMENT DATE - VMs deallocated, no SLA, no support
      
      Reference: https://azure.microsoft.com/updates?id=500578
    
    resource: azure.vm
    
    filters:
      # Match all NVv4-series VM sizes
      - type: value
        key: 'properties.hardwareProfile.vmSize'
        op: 'in'
        value:
          - 'Standard_NV4as_v4'
          - 'Standard_NV4ahs_v4'
          - 'Standard_NV8as_v4'
          - 'Standard_NV8ahs_v4'
          - 'Standard_NV16as_v4'
          - 'Standard_NV16ahs_v4'
          - 'Standard_NV32as_v4'
          - 'Standard_NV32ahs_v4'
      
      # Only flag running or stopped VMs (not already deallocated)
      - type: value
        key: 'properties.extended.instanceView.powerState.code'
        op: 'in'
        value:
          - 'PowerState/running'
          - 'PowerState/stopped'
          - 'PowerState/starting'
    
    actions:
      # Tag for migration tracking
      - type: tag
        tag: 'leftsize-migration-required'
        value: 'nvv4-series-retirement'
      
      - type: tag
        tag: 'leftsize-retirement-date'
        value: '2026-09-30'
      
      - type: tag
        tag: 'leftsize-detected-date'
        value: '{now:%Y-%m-%d}'
      
      # Mark for GitHub issue creation
      - type: mark-for-op
        op: notify
        days: 1  # Notify after 1 day
        tag: leftsize-nvv4-retirement-notify

  # ========================================
  # ⚡ AZURE FUNCTIONS DEPRECATIONS
  # ========================================
  
  - name: leftsize-functions-linux-consumption-retirement
    description: |
      Detect Azure Functions using the Linux Consumption hosting plan scheduled for retirement on September 30, 2028.
      
      Microsoft is retiring the Linux Consumption (Y1) hosting plan and recommends migration to Flex Consumption plan.
      
      Benefits of Flex Consumption:
      - Faster scaling and cold start mitigation
      - Advanced networking capabilities
      - Concurrency control for better resource management
      - Continued feature development and support
      
      Timeline:
      - September 30, 2025: No new features; removed from Azure Portal, Visual Studio, and VS Code
      - September 30, 2028: RETIREMENT DATE - No technical support, cannot create new Linux Consumption apps
      
      Detection:
      - Pricing Tier: Dynamic (Y1: 0)
      - Operating System: Linux
      - App Service Plans with Linux Consumption functions
      
      Note: Can still be managed via infrastructure as code and Azure CLI until retirement date.
    
    resource: azure.appserviceplan
    
    filters:
      # Match Linux Consumption hosting plan (Y1 SKU)
      - type: value
        key: 'sku.name'
        value: 'Y1'
      
      # Must be Linux OS
      - type: value
        key: 'kind'
        op: 'regex'
        value: '.*linux.*'
      
      # Only plans that have function apps deployed
      - type: value
        key: 'properties.numberOfSites'
        op: 'gt'
        value: 0
    
    actions:
      # Tag for migration tracking
      - type: tag
        tag: 'leftsize-migration-required'
        value: 'functions-linux-consumption-retirement'
      
      - type: tag
        tag: 'leftsize-retirement-date'
        value: '2028-09-30'
      
      - type: tag
        tag: 'leftsize-portal-removal-date'
        value: '2025-09-30'
      
      - type: tag
        tag: 'leftsize-detected-date'
        value: '{now:%Y-%m-%d}'
      
      # Mark for GitHub issue creation
      - type: mark-for-op
        op: notify
        days: 1  # Notify after 1 day
        tag: leftsize-functions-linux-consumption-notify

  # ========================================
  # ☸️ AKS KUBERNETES VERSION DEPRECATIONS
  # ========================================

  - name: leftsize-aks-outdated-version
    description: |
      Find AKS clusters running outdated Kubernetes versions.
      
      AKS version support (as of Feb 2026):
      - 1.30 and below: Out of standard support
      - 1.31: Out of standard support (ended Nov 2025)
      - 1.32: Standard support ending Mar 2026
      - 1.33, 1.34: Supported
      
      Current recommended: 1.33, 1.34
      
      Reference: https://learn.microsoft.com/en-us/azure/aks/supported-kubernetes-versions
    
    resource: azure.aks
    
    filters:
      # Match outdated Kubernetes versions
      - type: value
        key: 'properties.kubernetesVersion'
        op: in
        value:
          - '1.23'
          - '1.24'
          - '1.25'
          - '1.26'
          - '1.27'
          - '1.28'
          - '1.29'
          - '1.30'
          - '1.31'
      # Only running clusters
      - type: value
        key: 'properties.provisioningState'
        value: 'Succeeded'
    
    actions:
      - type: tag
        tag: 'leftsize-migration-required'
        value: 'aks-version-upgrade'
      
      - type: mark-for-op
        op: notify
        days: 7
        tag: leftsize-aks-upgrade-notify

  # ========================================
  # 🗄️ SQL DATABASE DTU MODEL (Legacy)
  # ========================================

  - name: leftsize-sql-database-dtu-model
    description: |
      Find Azure SQL Databases using the legacy DTU purchasing model.
      
      The DTU model is being phased out in favor of vCore:
      - DTU: Legacy, less flexible, harder to right-size
      - vCore: Modern, more control, reserved capacity discounts
      
      Benefits of migrating to vCore:
      - Up to 55% savings with reserved capacity
      - More granular compute/storage sizing
      - Hybrid benefit support (use existing SQL licenses)
      - Better performance predictability
      
      Reference: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tiers-dtu
    
    resource: azure.sql-database
    
    filters:
      # DTU-based SKUs (Basic, Standard S0-S12, Premium P1-P15)
      - type: value
        key: 'sku.tier'
        op: in
        value:
          - 'Basic'
          - 'Standard'
          - 'Premium'
      # Exclude system databases
      - type: value
        key: 'name'
        op: ne
        value: 'master'

  # ========================================
  # 🌐 APPLICATION GATEWAY DEPRECATIONS
  # ========================================

  # CRITICAL: Azure Application Gateway v1 retiring April 28, 2026
  - name: leftsize-appgateway-v1-deprecated
    description: |
      CRITICAL: Azure Application Gateway V1 SKU is being retired on April 28, 2026.
      
      After this date, Application Gateway V1 deployments will be stopped and force deleted.
      Microsoft recommends migrating to Application Gateway V2, which offers:
      - Autoscaling capability
      - Zone redundancy for high availability
      - Static VIP support
      - Header rewriting
      - Web Application Firewall v2 with improved rules
      - Better performance (up to 5x faster backend health probes)
      - Faster deployment and update times
      
      Timeline:
      - April 28, 2023: Deprecation announced
      - July 1, 2023: No new V1 deployments for new subscriptions
      - September 1, 2024: V1 creation completely stopped for all customers
      - April 28, 2026: RETIREMENT DATE - V1 gateways stopped and deleted
      
      V1 SKU Names (affected):
      - Standard_Small, Standard_Medium, Standard_Large
      - WAF_Medium, WAF_Large
      
      V2 SKU Names (target):
      - Standard_v2
      - WAF_v2
      
      Migration path:
      - Use Azure-provided migration script
      - Manual migration for complex configurations
      - Consider Azure Front Door for global load balancing scenarios
      
      Reference: https://learn.microsoft.com/en-us/azure/application-gateway/v1-retirement
    
    resource: azure.application-gateway
    
    filters:
      # Match V1 SKU names (Standard and WAF without _v2 suffix)
      - type: value
        key: 'properties.sku.name'
        op: 'in'
        value:
          - 'Standard_Small'
          - 'Standard_Medium'
          - 'Standard_Large'
          - 'WAF_Medium'
          - 'WAF_Large'
    
    actions:
      - type: tag
        tag: 'leftsize-deprecation'
        value: 'appgateway-v1-eol-apr-2026'
      
      - type: tag
        tag: 'leftsize-severity'
        value: 'critical'
      
      - type: tag
        tag: 'leftsize-action-required'
        value: 'migrate-to-v2'
      
      - type: tag
        tag: 'leftsize-retirement-date'
        value: '2026-04-28'
      
      - type: tag
        tag: 'leftsize-detected-date'
        value: '{now:%Y-%m-%d}'
      
      - type: mark-for-op
        op: notify
        days: 1
        tag: leftsize-appgateway-v1-deprecated-notify

  # ========================================
  # 💿 STANDARD HDD OS DISK RETIREMENT
  # ========================================

  - name: leftsize-hdd-os-disk-retirement
    description: |
      Detect Azure Managed Disks using Standard HDD (Standard_LRS) as OS disks.
      
      Microsoft is retiring the ability to use Standard HDD disks as OS disks
      on September 8, 2028. After that date, all Standard HDD OS disks will be
      automatically converted to Standard SSD disks of equivalent size.
      
      This automatic conversion may cause service disruptions. To avoid potential
      issues, proactively migrate your Standard HDD OS disks before the deadline.
      
      Recommended migration targets:
      - Standard SSD (Standard_LRS → StandardSSD_LRS): Closest price-to-performance ratio
      - Premium SSD (Standard_LRS → Premium_LRS): For workloads requiring higher performance
      
      Timeline:
      - Now: Stop creating new VMs with Standard HDD OS disks
      - Before September 8, 2028: Migrate all existing Standard HDD OS disks
      - September 8, 2028: RETIREMENT DATE — automatic conversion to Standard SSD
      
      Note: This retirement only affects OS disks. Standard HDD data disks and
      ephemeral OS disks are NOT affected.
      
      Reference: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-hdd-os-retirement
    
    resource: azure.disk
    
    filters:
      # Standard HDD SKU
      - type: value
        key: 'sku.name'
        value: 'Standard_LRS'
      
      # Is an OS disk (has osType set)
      - type: value
        key: 'properties.osType'
        op: not-equal
        value: null
    
    actions:
      - type: tag
        tag: 'leftsize-deprecation'
        value: 'hdd-os-disk-eol-sep-2028'
      
      - type: tag
        tag: 'leftsize-severity'
        value: 'medium'
      
      - type: tag
        tag: 'leftsize-action-required'
        value: 'migrate-to-standard-ssd'
      
      - type: tag
        tag: 'leftsize-retirement-date'
        value: '2028-09-08'
      
      - type: tag
        tag: 'leftsize-detected-date'
        value: '{now:%Y-%m-%d}'
      
      - type: mark-for-op
        op: notify
        days: 1
        tag: leftsize-hdd-os-disk-retirement-notify

  # ========================================
  # 🗄️ SERVICE DEPRECATIONS (Sep 2025)
  # ========================================

  # CRITICAL: Azure Database for MariaDB retiring September 19, 2025
  - name: leftsize-mariadb-deprecated
    description: |
      CRITICAL: Azure Database for MariaDB is being retired on September 19, 2025.
      
      After this date, you will lose access to:
      - Azure Database for MariaDB servers
      - All databases and data
      - Management capabilities
      
      Microsoft recommends migrating to Azure Database for MySQL - Flexible Server,
      which offers similar functionality with improved performance and features.
      
      Migration path:
      - Azure Database for MySQL - Flexible Server (recommended)
      - Azure Database for PostgreSQL - Flexible Server (alternative)
      - Self-hosted MariaDB on Azure VMs (if specific MariaDB features needed)
      
      Reference: https://azure.microsoft.com/updates?id=azure-database-for-mariadb-will-be-retired-on-19-september-2025-migrate-to-azure-database-for-mysql-flexible-server
    
    resource: azure.mariadb-server
    
    filters:
      # Match all MariaDB servers - the entire service is deprecated
      - type: value
        key: name
        op: not-equal
        value: ''
    
    actions:
      - type: tag
        tag: 'leftsize-deprecation'
        value: 'mariadb-eol-sep-2025'
      
      - type: tag
        tag: 'leftsize-severity'
        value: 'critical'
      
      - type: tag
        tag: 'leftsize-action-required'
        value: 'migrate-to-mysql-flexible'
      
      - type: tag
        tag: 'leftsize-detected-date'
        value: '{now:%Y-%m-%d}'
      
      - type: mark-for-op
        op: notify
        days: 1
        tag: leftsize-mariadb-deprecated-notify

  # HIGH: Azure Basic Load Balancer retiring September 30, 2025
  - name: leftsize-basic-loadbalancer-deprecated
    description: |
      Azure Basic Load Balancer is being retired on September 30, 2025.
      
      After this date, Basic Load Balancers will no longer be supported.
      Microsoft recommends upgrading to Standard Load Balancer, which offers:
      - SLA-backed availability (99.99%)
      - Zone redundancy
      - Health probes on any TCP/HTTP/HTTPS port
      - Outbound rules
      - Multiple frontend IPs
      - HA Ports
      - Diagnostic logging
      
      Migration path:
      - Upgrade to Standard Load Balancer (recommended)
      - Use Azure Load Balancer Upgrade tool for automated migration
      
      Note: Standard Load Balancer is not free - it incurs hourly charges.
      However, Basic LB was never recommended for production workloads.
      
      Reference: https://azure.microsoft.com/updates?id=azure-basic-load-balancer-will-be-retired-on-30-september-2025-upgrade-to-standard-load-balancer
    
    resource: azure.loadbalancer
    
    filters:
      # Match Basic SKU load balancers only
      - type: value
        key: sku.name
        value: 'Basic'
    
    actions:
      - type: tag
        tag: 'leftsize-deprecation'
        value: 'basic-lb-eol-sep-2025'
      
      - type: tag
        tag: 'leftsize-severity'
        value: 'high'
      
      - type: tag
        tag: 'leftsize-action-required'
        value: 'upgrade-to-standard-lb'
      
      - type: tag
        tag: 'leftsize-detected-date'
        value: '{now:%Y-%m-%d}'
      
      - type: mark-for-op
        op: notify
        days: 1
        tag: leftsize-basic-lb-deprecated-notify

  # ========================================
  # 💿 UNMANAGED DISKS RETIREMENT (Mar 2026)
  # ========================================

  # CRITICAL: Azure Unmanaged Disks retiring March 31, 2026
  - name: leftsize-unmanaged-disks-retirement
    description: |
      CRITICAL: Azure unmanaged disks are being retired on March 31, 2026.
      
      Unmanaged disks are VHD page blobs stored in user-managed storage accounts.
      They were the original disk type for Azure VMs before managed disks launched
      in 2017. Microsoft announced the retirement on September 13, 2022.
      
      After March 31, 2026:
      - You cannot start IaaS VMs that use unmanaged disks
      - Any running or allocated VMs with unmanaged disks will be stopped and deallocated
      
      This retirement only affects page blobs used as virtual disks attached to VMs.
      Page blobs accessed via HTTP/HTTPS REST APIs (not attached to VMs) are NOT affected.
      
      Benefits of migrating to managed disks:
      - No storage account management overhead
      - High availability with 99.999% uptime SLA
      - Better scalability and disk bursting
      - Shared disk support
      - Improved security with RBAC and encryption at rest
      - Snapshot and image support
      - Azure Backup integration
      
      Migration path:
      - Windows VMs: Use Convert-AzVMManagedDisk PowerShell command
      - Linux VMs: Use az vm convert Azure CLI command
      - Both require VM deallocation
      
      Timeline:
      - September 13, 2022: Retirement announced
      - September 30, 2025: Originally planned retirement date
      - March 31, 2026: RETIREMENT DATE (extended) — VMs stopped and deallocated
      
      Reference: https://learn.microsoft.com/en-us/azure/virtual-machines/unmanaged-disks-deprecation
    
    resource: azure.vm
    
    filters:
      # Detect VMs using unmanaged disks by checking for absence of managedDisk on OS disk
      - type: value
        key: 'properties.storageProfile.osDisk.managedDisk'
        value: null

      # Only flag running or stopped VMs (not already deallocated)
      - type: value
        key: 'properties.extended.instanceView.powerState.code'
        op: 'in'
        value:
          - 'PowerState/running'
          - 'PowerState/stopped'
          - 'PowerState/starting'
    
    actions:
      - type: tag
        tag: 'leftsize-deprecation'
        value: 'unmanaged-disks-eol-mar-2026'
      
      - type: tag
        tag: 'leftsize-severity'
        value: 'critical'
      
      - type: tag
        tag: 'leftsize-action-required'
        value: 'migrate-to-managed-disks'
      
      - type: tag
        tag: 'leftsize-retirement-date'
        value: '2026-03-31'
      
      - type: tag
        tag: 'leftsize-detected-date'
        value: '{now:%Y-%m-%d}'
      
      - type: mark-for-op
        op: notify
        days: 1
        tag: leftsize-unmanaged-disks-retirement-notify

