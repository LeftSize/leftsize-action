  # ========================================
  # 🗄️ STORAGE ACCOUNT KIND RETIREMENT (Oct 2026)
  # ========================================

  - name: leftsize-storage-legacy-account-retirement
    description: |
      Find general-purpose v1 (kind 'Storage') and legacy Blob Storage
      (kind 'BlobStorage') accounts. Both account kinds retire in October 2026.

      Timeline:
      - September 2025: Retirement announced
      - September 2026: Creation of new GPv1 / legacy Blob Storage accounts disabled
        (the upgrade page says "Q1 2026" for GPv1)
      - October 13, 2026: Full retirement. Remaining accounts are auto-migrated
        to GPv2, which "may result in higher billing costs" (transaction pricing
        differs). The GPv1 overview only says "October 2026"; the upgrade page and
        the legacy Blob Storage page give October 13, 2026.
      - The legacy Blob Storage page ALSO says "After the retirement date, data
        access will be blocked for all legacy blob storage accounts", which
        contradicts its own auto-migration wording.

      The upgrade to GPv2 is in place, has no downtime, can't be undone, and
      defaults the account access tier to Hot unless you set it.

      Filters mirror Microsoft's own Azure Resource Graph inventory query
      (Standard SKUs, kind != StorageV2). Databricks-managed DBFS accounts
      (resource group 'databricks-rg-*') are skipped: Microsoft migrates them and
      they are read-only for the customer.

      References:
      - https://learn.microsoft.com/en-us/azure/storage/common/general-purpose-version-1-account-migration-overview
      - https://learn.microsoft.com/en-us/azure/storage/common/legacy-blob-storage-account-migration-overview
      - https://learn.microsoft.com/en-us/azure/storage/common/storage-account-upgrade
    resource: azure.storage
    filters:
      # GPv1 ('Storage') and legacy Blob Storage ('BlobStorage') account kinds
      - type: value
        key: 'kind'
        op: 'in'
        value: ['Storage', 'BlobStorage']
      # Same SKU scope as Microsoft's inventory query (Premium kind=Storage excluded)
      - type: value
        key: 'sku.name'
        value_type: normalize
        op: 'in'
        value: ['standard_lrs', 'standard_grs', 'standard_zrs', 'standard_ragrs', 'standard_ragzrs']
      # Skip Databricks-managed DBFS accounts (Microsoft migrates these)
      - not:
          - type: value
            key: 'resourceGroup'
            op: 'regex'
            value: '^databricks-rg-'
    metadata:
      category: deprecation
      severity: high
      tier: free

  # ========================================
  # 🖥️ VM SIZE RETIREMENTS (2027-2029)
  # ========================================
  # Source for all VM rules below:
  # https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/lifecycle/retirements-and-capacity-restrictions
  # https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/lifecycle/retirement/retired-sizes-modernization-guide
  # Size regexes were checked against `az vm list-skus` (westeurope, northeurope,
  # eastus, southcentralus, westus2, uaenorth), the Azure SDK VirtualMachineSizeTypes
  # enum and the size names on the Learn series pages. They are anchored and
  # case-insensitive (c7n 'regex' uses re.IGNORECASE).
  #
  # Power state: c7n lists VMs without the instance view, so the Resource Graph
  # path 'properties.extended.instanceView.powerState.code' doesn't exist on
  # c7n resources. The 'instance-view' filter fetches it per VM; it runs last so
  # only VMs that already matched the size filter cost an extra API call.

  - name: leftsize-vm-m192i-v2-retirement
    description: |
      Find VMs on the isolated Msv2/Mdsv2 Medium Memory sizes
      (Standard_M192is_v2, M192ims_v2, M192ids_v2, M192idms_v2).

      Timeline:
      - March 22, 2024: Retirement announced
      - March 31, 2027: RETIREMENT - remaining VMs are deallocated
        (stopped, removed from the host, no longer billed)

      Recommended migration: Msv3 / Mdsv3 Medium Memory series.

      Reference: https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/lifecycle/retirement/msv2-mdsv2-retirement
    resource: azure.vm
    filters:
      - type: value
        key: 'properties.hardwareProfile.vmSize'
        value_type: normalize
        op: 'in'
        value:
          - 'standard_m192is_v2'
          - 'standard_m192ims_v2'
          - 'standard_m192ids_v2'
          - 'standard_m192idms_v2'
      # Running, stopped (still allocated) or starting VMs only
      - type: instance-view
        key: 'statuses[].code'
        op: intersect
        value: ['PowerState/running', 'PowerState/stopped', 'PowerState/starting']
    metadata:
      category: deprecation
      severity: high
      tier: free

  - name: leftsize-vm-hpc-fpga-retirement-2027
    description: |
      Find VMs on the NP-series (FPGA), HC-series and HBv2-series (HPC) sizes.

      Sizes:
      - NP: Standard_NP10s, NP20s, NP40s
      - HC: Standard_HC44rs, HC44-16rs, HC44-32rs
      - HBv2: Standard_HB120rs_v2 and constrained-core HB120-16/32/64/96rs_v2

      Timeline:
      - April 2, 2026: 1-year and 3-year Reserved Instance purchases ended
      - May 31, 2027: RETIREMENT - remaining VMs are deallocated, no SLA,
        no support (managed disk data is preserved)

      Recommended migration: HBv5 / HBv4 / HX / HBv3 (HC, HBv2);
      NDv2 / NCads_H100_v5 / NCasT4_v3 (NP, requires porting FPGA code to GPU).

      References:
      - https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/lifecycle/retirement/np-series-retirement
      - https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/lifecycle/retirement/hc-series-retirement
      - https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/lifecycle/retirement/hbv2-series-retirement
    resource: azure.vm
    filters:
      - type: value
        key: 'properties.hardwareProfile.vmSize'
        op: 'regex'
        value: '^Standard_(NP\d+s|HC44(-\d+)?rs|HB120(-\d+)?rs_v2)$'
      - type: instance-view
        key: 'statuses[].code'
        op: intersect
        value: ['PowerState/running', 'PowerState/stopped', 'PowerState/starting']
    metadata:
      category: deprecation
      severity: high
      tier: free

  - name: leftsize-vm-series-retirement-2028-05
    description: |
      Find VMs on the D, Ds, Dv2, Dsv2 and Ls series.

      Sizes: Standard_D1-D14, DS1-DS14, D1_v2-D15_v2, DS1_v2-DS15_v2
      (incl. constrained-core DS11-1_v2 ... DS14-8_v2 and _Promo), L4s-L32s.

      Timeline:
      - March 31, 2025: Retirement announced
      - July 2026: Capacity growth restrictions (no extra quota, new subscriptions
        can't deploy); 1-year RIs can't be bought or renewed after July 1, 2026
      - February 1, 2027: End of regular RI exchanges for these series
      - May 1, 2028: RETIREMENT - remaining VMs are deallocated, no SLA, no support

      Recommended migration: Dsv5/Ddsv5/Dasv5/Dadsv5, Dsv6/Ddsv6/Dasv6/Dadsv6,
      Dasv7/Dadsv7 (D, Ds, Dv2, Dsv2); Lsv3/Lasv3/Lsv4/Lasv4 (Ls).
    resource: azure.vm
    filters:
      - type: value
        key: 'properties.hardwareProfile.vmSize'
        op: 'regex'
        value: '^Standard_(DS?\d+(-\d+)?|DS?\d+(-\d+)?_v2(_Promo)?|L\d+s)$'
      - type: instance-view
        key: 'statuses[].code'
        op: intersect
        value: ['PowerState/running', 'PowerState/stopped', 'PowerState/starting']
    metadata:
      category: deprecation
      severity: medium
      tier: free

  - name: leftsize-vm-series-retirement-2028-11
    description: |
      Find VMs on the Av2, Amv2, B (v1), F, Fs, Fsv2, G, Gs and Lsv2 series.

      Sizes: Standard_A1_v2-A8_v2, A2m_v2-A8m_v2, B1ls-B20ms (not Bsv2/Basv2/Bpsv2),
      F1-F16, F1s-F16s, F2s_v2-F72s_v2, G1-G5, GS1-GS5 (incl. GS4-4/-8, GS5-8/-16),
      L8s_v2-L80s_v2.

      Timeline:
      - October 15, 2025: Retirement announced
      - July 2026: Capacity growth restrictions; 1-year RIs can't be bought or
        renewed after July 1, 2026
      - February 1, 2027: End of regular RI exchanges for these series
      - November 15, 2028: RETIREMENT - remaining VMs are deallocated, no SLA,
        no support
    resource: azure.vm
    filters:
      - type: value
        key: 'properties.hardwareProfile.vmSize'
        op: 'regex'
        value: '^Standard_(A\d+m?_v2|B\d+(ls|s|ms)|F\d+s?|F\d+s_v2|GS?\d+(-\d+)?|L\d+s_v2)$'
      - type: instance-view
        key: 'statuses[].code'
        op: intersect
        value: ['PowerState/running', 'PowerState/stopped', 'PowerState/starting']
    metadata:
      category: deprecation
      severity: medium
      tier: free

  - name: leftsize-vm-v3-series-retirement-2029
    description: |
      Find VMs on the Dv3, Dsv3, Ev3 and Esv3 series (incl. E64i_v3, E64is_v3
      and constrained-core Esv3 sizes).

      Timeline:
      - July 1, 2026: 1-year and 3-year RIs can't be bought or renewed;
        capacity growth restrictions start (July 2026)
      - February 1, 2027: End of regular RI exchanges
      - November 15, 2029: RETIREMENT - you can't create, resize into, run or
        purchase these sizes (public Azure; not Azure Government / 21Vianet /
        sovereign clouds)

      Recommended migration: Dv5/Dsv5/Ddv5/Ddsv5/Dasv5/Dadsv5 and
      Ev5/Esv5/Edv5/Edsv5/Easv5/Eadsv5 (or v6/v7).
    resource: azure.vm
    filters:
      - type: value
        key: 'properties.hardwareProfile.vmSize'
        op: 'regex'
        value: '^Standard_(D\d+s?_v3|E\d+(-\d+)?i?s?_v3)$'
      - type: instance-view
        key: 'statuses[].code'
        op: intersect
        value: ['PowerState/running', 'PowerState/stopped', 'PowerState/starting']
    metadata:
      category: deprecation
      severity: low
      tier: free

  # ========================================
  # ☸️ AKS NODE OS / NETWORKING / ADD-ON RETIREMENTS
  # ========================================

  - name: leftsize-aks-azure-linux-2-node-pools
    description: |
      Find AKS clusters with node pools still on Azure Linux 2.0 (CBL-Mariner 2.0).

      Timeline:
      - Nov 30, 2025: Azure Linux 2.0 no longer supported on AKS, no security
        updates. Node image frozen at 202512.06.0.
      - Oct 31, 2026: Azure Linux 2.0 node images are removed. Node pools can no
        longer scale (scale-out, autoscaler, reimage, redeploy fail).

      Detection uses the pool's nodeImageVersion (AKSAzureLinux-V2* or
      AKSCBLMariner-V2*), because osSKU "AzureLinux" means 2.0 on Kubernetes
      1.26-1.31 and 3.0 on 1.32+.

      Reference: https://learn.microsoft.com/en-us/azure/aks/node-images
      Reference: https://learn.microsoft.com/en-us/azure/aks/upgrade-os-version

    resource: azure.aks

    filters:
      - type: value
        key: properties.provisioningState
        op: ne
        value_type: normalize
        value: deleting
      # Any node pool running an Azure Linux 2.0 / CBL-Mariner 2.0 node image
      - type: list-item
        key: properties.agentPoolProfiles
        attrs:
          - type: value
            key: nodeImageVersion
            op: regex
            value: '^AKS(AzureLinux|CBLMariner)-V2.*$'

    metadata:
      category: deprecation
      severity: critical
      tier: free

  - name: leftsize-aks-ubuntu-2004-node-pools
    description: |
      Find AKS clusters with node pools on Ubuntu 20.04 node images.

      Timeline:
      - Mar 17, 2027: AKS stops supporting Ubuntu 20.04, stops security updates
        and deletes existing Ubuntu 20.04 node images. Node pools can no longer
        scale.

      Ubuntu 20.04 pools are typically Confidential VM (CVM) or FIPS pools, or
      pools on old Kubernetes versions. Microsoft's remediation: upgrade the
      node pools to Kubernetes 1.35+ (Ubuntu 24.04).

      Reference: https://learn.microsoft.com/en-us/azure/aks/node-images

    resource: azure.aks

    filters:
      - type: value
        key: properties.provisioningState
        op: ne
        value_type: normalize
        value: deleting
      - type: list-item
        key: properties.agentPoolProfiles
        attrs:
          - type: value
            key: nodeImageVersion
            op: regex
            value: '^AKSUbuntu-2004.*$'

    metadata:
      category: deprecation
      severity: high
      tier: free

  - name: leftsize-aks-ubuntu-2204-node-pools
    description: |
      Find AKS clusters with node pools on Ubuntu 22.04.

      Timeline:
      - Jun 30, 2027: AKS stops supporting Ubuntu 22.04. No new node images, no
        security patches, no new Ubuntu 22.04 node pools.
      - Apr 30, 2028: Ubuntu 22.04 node images are removed. Scaling and
        remediation operations fail.

      Ubuntu 22.04 is the default for osSKU "Ubuntu" on Kubernetes 1.25-1.34,
      so most clusters below 1.35 match. Migrate by upgrading to Kubernetes
      1.35+ (osSKU Ubuntu) or by setting osSKU Ubuntu2404 (Kubernetes 1.32+).

      Reference: https://learn.microsoft.com/en-us/azure/aks/node-images
      Reference: https://learn.microsoft.com/en-us/azure/aks/upgrade-os-version

    resource: azure.aks

    filters:
      - type: value
        key: properties.provisioningState
        op: ne
        value_type: normalize
        value: deleting
      - type: list-item
        key: properties.agentPoolProfiles
        attrs:
          - or:
              - type: value
                key: nodeImageVersion
                op: regex
                value: '^AKSUbuntu-2204.*$'
              # Versioned OS SKU pinned to 22.04
              - type: value
                key: osSKU
                value_type: normalize
                value: ubuntu2204

    metadata:
      category: deprecation
      severity: medium
      tier: free

  - name: leftsize-aks-windows-unsupported-node-pools
    description: |
      Find AKS clusters with Windows node pools on Windows Server 2019 or
      Windows Server Annual Channel (preview). Both are already unsupported.

      Windows Server 2019:
      - Mar 2026: support ended (Azure Update: Mar 1, 2026; Azure lifecycle
        page: Mar 31, 2026). Not supported on Kubernetes 1.33+.
      - Apr 1, 2027: node images removed, scaling fails (AKS retirement
        GitHub issue Azure/AKS#4091).

      Windows Server Annual Channel (preview):
      - May 15, 2026: support ended, no new images or security patches.
      - May 15, 2027: node images removed, scaling/reimage/redeploy fail.

      Both need a new Windows Server 2022/2025 (LTSC) node pool; there is no
      in-place OS SKU update from these versions.

      Reference: https://learn.microsoft.com/en-us/azure/aks/windows-faq
      Reference: https://learn.microsoft.com/en-us/azure/aks/node-images
      Reference: https://learn.microsoft.com/en-us/azure/aks/upgrade-windows-os

    resource: azure.aks

    filters:
      - type: value
        key: properties.provisioningState
        op: ne
        value_type: normalize
        value: deleting
      - type: list-item
        key: properties.agentPoolProfiles
        attrs:
          - or:
              # e.g. AKSWindows-2019-containerd-17763.x, AKSWindows-23H2-gen2-25398.x
              - type: value
                key: nodeImageVersion
                op: regex
                value: '^AKSWindows-(2019|23H2|24H2)-.*$'
              - type: value
                key: osSKU
                op: in
                value_type: normalize
                value: ['windows2019', 'windowsannual']

    metadata:
      category: deprecation
      severity: critical
      tier: free

  - name: leftsize-aks-kubenet-retirement
    description: |
      Find AKS clusters using kubenet networking.

      Timeline:
      - Mar 31, 2028: kubenet networking for AKS is retired; kubenet workloads
        are no longer supported.

      Migrate in place to Azure CNI Overlay (az aks update --network-plugin azure
      --network-plugin-mode overlay). One-way operation that reimages all node
      pools; requires Kubernetes 1.27+, no network policy engine, and a
      user-assigned managed identity to detach the kubenet route table.

      Reference: https://learn.microsoft.com/en-us/azure/aks/configure-kubenet
      Reference: https://learn.microsoft.com/en-us/azure/aks/upgrade-azure-cni

    resource: azure.aks

    filters:
      - type: value
        key: properties.provisioningState
        op: ne
        value_type: normalize
        value: deleting
      - type: value
        key: properties.networkProfile.networkPlugin
        value_type: normalize
        value: kubenet

    metadata:
      category: deprecation
      severity: medium
      tier: free

  - name: leftsize-aks-open-service-mesh-retirement
    description: |
      Find AKS clusters with the Open Service Mesh (OSM) add-on enabled.

      Timeline:
      - Sep 30, 2027: AKS stops supporting the OSM add-on (upstream OSM project
        is archived). Security patches only until then.

      Migrate to the managed Istio add-on (az aks mesh enable) and disable OSM
      (az aks disable-addons --addons open-service-mesh).

      Reference: https://learn.microsoft.com/en-us/azure/aks/open-service-mesh-about
      Reference: https://learn.microsoft.com/en-us/azure/aks/open-service-mesh-istio-migration-guidance

    resource: azure.aks

    filters:
      - type: value
        key: properties.provisioningState
        op: ne
        value_type: normalize
        value: deleting
      - type: value
        key: properties.addonProfiles.openServiceMesh.enabled
        value: true

    metadata:
      category: deprecation
      severity: medium
      tier: free

  # ========================================
  # ⚡ AZURE FUNCTIONS - RUNTIME / LANGUAGE END OF SUPPORT
  # ========================================

  - name: leftsize-functions-dotnet-inprocess-end-of-support
    description: |
      Detect Linux function apps that run C# on the .NET in-process model.
      Support for the in-process model ends on November 10, 2026. Migrate to the isolated worker model.

      Timeline:
      - .NET 8 is the last (and only) .NET version supported by the in-process model
      - November 10, 2026: END OF SUPPORT - in-process model (and .NET 8) no longer supported
      - Flex Consumption does not support the in-process model at all

      Detection (Linux only):
      - Site kind contains "functionapp" and "linux" (Logic Apps Standard "workflowapp" excluded)
      - Site config linuxFxVersion is "DOTNET|<version>" (in-process). Isolated apps use "DOTNET-ISOLATED|<version>".
      - Uses the c7n `configuration` filter (GET sites/config/web, Reader permission is sufficient).
      Windows function apps are NOT detected: on Windows the model is only visible in the
      FUNCTIONS_WORKER_RUNTIME app setting, which needs secret-level permission to read.

      Reference: https://learn.microsoft.com/en-us/azure/azure-functions/migrate-dotnet-to-isolated-model
      Reference: https://learn.microsoft.com/en-us/azure/azure-functions/migrate-version-3-version-4 (linuxFxVersion values)

    resource: azure.webapp

    metadata:
      category: deprecation
      severity: high
      tier: free

    filters:
      # Function apps only (kind is e.g. "functionapp,linux")
      - type: value
        key: 'kind'
        op: regex
        value: '.*functionapp.*'
      # Linux only - linuxFxVersion is not used for the stack on Windows
      - type: value
        key: 'kind'
        op: regex
        value: '.*linux.*'
      # Exclude Logic Apps Standard (kind "functionapp,workflowapp[,linux]")
      - not:
          - type: value
            key: 'kind'
            op: regex
            value: '.*workflowapp.*'
      # In-process .NET: "DOTNET|8.0" (isolated is "DOTNET-ISOLATED|8.0" and does not match)
      - type: configuration
        key: 'linuxFxVersion'
        op: regex
        value: '^dotnet\|[0-9.]+$'

  - name: leftsize-functions-linux-language-end-of-support
    description: |
      Detect Linux function apps whose language stack version is out of support or reaches
      end of support on or before November 10, 2026 (per the Azure Functions supported-languages table).

      Covered stack versions (linuxFxVersion, case-insensitive):
      - DOTNET-ISOLATED|6.0, 7.0 (ended 2024), 8.0 and 9.0 (end of support November 10, 2026)
      - PYTHON|3.6 - 3.9 (ended), 3.10 (end of support October 2026)
      - POWERSHELL|7.0, 7.2 (ended), 7.4 (end of support November 10, 2026)
      - NODE|20 and older (Node.js 20 end of support April 30, 2026; only 22 and 24 are listed as supported)
      Not covered: Java (8/11/17 supported until September 2027), Node.js 22 (April 30, 2027).
      The .NET in-process model (DOTNET|x) is covered by leftsize-functions-dotnet-inprocess-end-of-support.

      Apps keep running after end of support but get no security patches or support.
      Linux Consumption apps cannot move to .NET 10, Node.js 24, Python 3.13+ or PowerShell 7.6 without
      migrating to Flex Consumption first.

      Detection (Linux only): site kind contains "functionapp" and "linux", configuration linuxFxVersion
      matches an affected stack. Windows apps and Flex Consumption apps (runtime stored in
      properties.functionAppConfig.runtime, empty linuxFxVersion) are not detected.

      Reference: https://learn.microsoft.com/en-us/azure/azure-functions/supported-languages
      Reference: https://learn.microsoft.com/en-us/azure/azure-functions/update-language-versions

    resource: azure.webapp

    metadata:
      category: deprecation
      severity: high
      tier: free

    filters:
      - type: value
        key: 'kind'
        op: regex
        value: '.*functionapp.*'
      - type: value
        key: 'kind'
        op: regex
        value: '.*linux.*'
      - not:
          - type: value
            key: 'kind'
            op: regex
            value: '.*workflowapp.*'
      # Affected language stack versions (regex is case-insensitive in c7n)
      - type: configuration
        key: 'linuxFxVersion'
        op: regex
        # optional third segment = managed Linux image version, e.g. "Python|3.11|2.0"
        value: '^(dotnet-isolated\|[6-9]\.0|python\|3\.([6-9]|10)|powershell\|7\.[0-4]|node\|([0-9]|1[0-9]|20))(\|[0-9.]+)?$'

  # ========================================
  # 🤖 AZURE AI SERVICES (COGNITIVE SERVICES) RETIREMENTS
  # ========================================

  - name: leftsize-ai-services-retired
    description: |
      Detect Azure AI services (Cognitive Services) accounts whose service has already been retired.
      These resources no longer provide a supported service; migrate the workload and delete the account.

      Retired services (kind):
      - QnAMaker: retired October 31, 2025 -> custom question answering (Azure Language)
      - LUIS / LUIS.Authoring: fully retired March 31, 2026 -> conversational language understanding (CLU)
      - MetricsAdvisor: retired (product docs: May 18, 2026; lifecycle page: October 1, 2026)
      - Personalizer: retired (product docs: August 25, 2026; lifecycle page: October 1, 2026)
      - AnomalyDetector: retired October 1, 2026 -> Microsoft Fabric anomaly detection / open-source anomaly-detector

      Reference: https://learn.microsoft.com/en-us/lifecycle/end-of-support/end-of-support-2026
      Reference: https://learn.microsoft.com/en-us/azure/ai-services/luis/what-is-luis
      Reference: https://learn.microsoft.com/en-us/azure/ai-services/qnamaker/overview/overview
      Reference: https://learn.microsoft.com/en-us/azure/ai-services/anomaly-detector/overview

    resource: azure.cognitiveservice

    metadata:
      category: deprecation
      severity: high
      tier: free

    filters:
      - type: value
        key: 'kind'
        op: in
        value_type: normalize
        value:
          - 'luis'
          - 'luis.authoring'
          - 'qnamaker'
          - 'anomalydetector'
          - 'metricsadvisor'
          - 'personalizer'

  - name: leftsize-content-moderator-retirement
    description: |
      Detect Azure Content Moderator accounts. Content Moderator has been deprecated since February 2024
      and is retired on March 15, 2027 (product documentation). The Microsoft lifecycle product page lists
      March 31, 2027; plan for the earlier date. Replacement: Azure AI Content Safety.

      Reference: https://learn.microsoft.com/en-us/azure/ai-services/content-moderator/overview
      Reference: https://learn.microsoft.com/en-us/lifecycle/products/azure-ai-content-moderator

    resource: azure.cognitiveservice

    metadata:
      category: deprecation
      severity: high
      tier: free

    filters:
      - type: value
        key: 'kind'
        op: eq
        value_type: normalize
        value: 'contentmoderator'

  # ========================================
  # 🌱 AZURE SPRING APPS RETIREMENT
  # ========================================

  - name: leftsize-spring-apps-retirement
    description: |
      Detect Azure Spring Apps service instances. All plans (Basic, Standard, Enterprise) entered a
      three-year retirement period on March 17, 2025 and are retired on March 31, 2028. After that date
      you no longer have access to your workloads. Migrate to Azure Container Apps (recommended) or AKS.

      Timeline:
      - March 17, 2025: retirement period starts, no new customers
      - August/September 2025: Tanzu App Live View, App Accelerator, App Configuration Service out of support (Enterprise)
      - March 31, 2028: RETIREMENT DATE - service discontinued

      Reference: https://learn.microsoft.com/en-us/azure/spring-apps/basic-standard/retirement-announcement

    resource: azure.spring-service-instance

    metadata:
      category: deprecation
      severity: high
      tier: free

  # ========================================
  # ☁️ CLOUD SERVICES (EXTENDED SUPPORT) RETIREMENT
  # ========================================

  - name: leftsize-cloud-services-extended-support-retirement
    description: |
      Detect Cloud Services (extended support) deployments (Microsoft.Compute/cloudServices).
      Deprecated since March 31, 2025 and fully retired on March 31, 2027. No extensions are granted.
      Migrate to Service Fabric managed clusters, Virtual Machine Scale Sets, App Service, AKS or Container Apps.

      Detection uses the generic ARM resource list (no dedicated c7n resource type exists).

      Reference: https://learn.microsoft.com/en-us/azure/cloud-services-extended-support/overview
      Reference: https://learn.microsoft.com/en-us/azure/service-fabric/service-fabric-cloud-services-migration-faq

    resource: azure.armresource

    metadata:
      category: deprecation
      severity: critical
      tier: free

    filters:
      - type: resource-type
        values:
          - 'Microsoft.Compute/cloudServices'

  # ========================================
  # 🌐 NETWORKING RETIREMENTS (public IP, WAF config, Front Door / CDN classic, NSG flow logs)
  # ========================================

  # HIGH: Basic SKU public IP addresses were retired on September 30, 2025
  - name: leftsize-basic-public-ip-retired
    description: |
      Basic SKU public IP addresses were retired on September 30, 2025.

      Basic public IPs remain operational after the retirement date, but Microsoft
      states that customers who keep using them "accept the risks and acknowledge
      that the service is unsupported and not covered by SLA guarantees".

      Upgrade path depends on what the IP is attached to:
      - Unattached IP: set allocation to Static, then `az network public-ip update --sku Standard`
        (keeps the IP address; one-way)
      - Virtual machine: AzureVMPublicIPUpgrade PowerShell module (Start-VMPublicIPUpgrade)
      - Basic Load Balancer: upgrade the LB with the AzureBasicLoadBalancerUpgrade module
      - VPN / ExpressRoute gateway: gateway migration to AZ SKUs
      - Application Gateway v1: migrate to Application Gateway v2

      Standard public IPs are "secure by default": inbound traffic must be allowed by an NSG.
      Cloud Services (extended support) deployments are exempt from this retirement.

      Timeline:
      - September 30, 2025: RETIREMENT DATE - Basic public IPs unsupported, no SLA

      Reference: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-basic-upgrade-guidance

    resource: azure.publicip

    filters:
      # Basic SKU only (Standard SKU is the supported replacement)
      - type: value
        key: sku.name
        value: 'Basic'

    metadata:
      category: deprecation
      severity: high
      tier: free

  # HIGH: Application Gateway WAF v2 legacy "WAF configuration" retires March 15, 2027
  - name: leftsize-appgateway-waf-config-retirement
    description: |
      WAF configuration (the legacy, inline webApplicationFirewallConfiguration) on
      Application Gateway WAF v2 retires on March 15, 2027. Microsoft isn't making further
      investments in WAF configuration; upgrade to a WAF Policy at no extra cost.

      The upgrade can be done in place without downtime (portal "Upgrade from WAF
      configuration", Azure Firewall Manager, or the migrateToWafPolicy.ps1 script).

      Timeline:
      - March 15, 2024: Deprecation announced
      - March 15, 2025: No new WAF configuration deployments
      - March 15, 2027: RETIREMENT DATE

      Note: gateways that have a custom-rules-only policy AND a legacy WAF configuration
      still need the upgrade, so this rule does not require firewallPolicy to be absent.

      Reference: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/upgrade-ag-waf-policy

    resource: azure.application-gateway

    filters:
      # Only WAF v2 gateways (v1 is covered by leftsize-appgateway-v1-deprecated)
      - type: value
        key: properties.sku.tier
        value: 'WAF_v2'

      # Still carries the legacy inline WAF configuration
      - type: value
        key: properties.webApplicationFirewallConfiguration
        value: present

    metadata:
      category: deprecation
      severity: high
      tier: free

  # HIGH: Azure Front Door (classic) retires March 31, 2027
  - name: leftsize-front-door-classic-retirement
    description: |
      Azure Front Door (classic) retires on March 31, 2027.

      After retirement you lose the ability to create or manage classic resources, access
      them through the portal or APIs/SDKs/tools, receive service updates, or get support.
      No new classic profiles since April 1, 2025; no managed certificates since August 15, 2025.

      Microsoft provides a zero-downtime migration tool (portal or Azure PowerShell) to
      Azure Front Door Standard or Premium. After migration, update DNS/clients to the new
      endpoint by March 31, 2028 (classic endpoints may stop functioning from April 1, 2028).

      azure.front-door enumerates Microsoft.Network/frontDoors, which is only the classic tier
      (Standard/Premium profiles are Microsoft.Cdn/profiles), so no extra filter is needed.

      Timeline:
      - April 1, 2025: No new classic profiles
      - August 15, 2025: No managed certificates
      - March 31, 2027: RETIREMENT DATE

      Reference: https://learn.microsoft.com/en-us/azure/frontdoor/classic-retirement-faq

    resource: azure.front-door

    metadata:
      category: deprecation
      severity: high
      tier: free

  # MEDIUM: Azure CDN Standard from Microsoft (classic) retires September 30, 2027
  - name: leftsize-cdn-classic-retirement
    description: |
      Azure CDN Standard from Microsoft (classic) retires on September 30, 2027.

      After retirement you lose the ability to create or manage these resources, access
      them through the portal or APIs/SDKs/tools, receive updates, or get support.
      No new profiles, domain onboarding or managed certificates since August 15, 2025.

      Migrate to Azure Front Door Standard or Premium with the portal migration tool
      (Validate -> Prepare -> Migrate). After migration, cut over DNS/clients to the new
      endpoint by March 31, 2028.

      azure.cdnprofile also returns Azure Front Door Standard/Premium profiles, so only the
      exact Standard_Microsoft SKU is matched.

      Timeline:
      - August 15, 2025: No new profiles / domains / managed certificates
      - September 30, 2027: RETIREMENT DATE

      Reference: https://learn.microsoft.com/en-us/azure/cdn/classic-cdn-retirement-faq

    resource: azure.cdnprofile

    filters:
      - type: value
        key: sku.name
        value: 'Standard_Microsoft'

    metadata:
      category: deprecation
      severity: medium
      tier: free

  # MEDIUM: NSG flow logs retire September 30, 2027 (flow log resources are deleted)
  - name: leftsize-nsg-flow-logs-retirement
    description: |
      Network security group (NSG) flow logs retire on September 30, 2027. New NSG flow
      logs can no longer be created.

      After the retirement date Azure no longer supports traffic analytics for NSG flow logs
      and deletes existing NSG flow log resources. Existing log records in Azure Storage are
      kept and follow their retention policy.

      Migrate to virtual network flow logs (portal "Migrate flow logs" script, Azure Policy,
      or `az network watcher flow-log create --vnet ...`).

      Detection: the NSG's read-only properties.flowLogs array lists the flow log resources
      attached to it (the same field c7n's own flow-logs filter reads).

      Timeline:
      - September 30, 2027: RETIREMENT DATE - NSG flow log resources deleted

      Reference: https://learn.microsoft.com/en-us/azure/network-watcher/nsg-flow-logs-overview

    resource: azure.networksecuritygroup

    filters:
      # NSG has at least one NSG flow log attached
      - type: value
        key: properties.flowLogs
        value: not-null

    metadata:
      category: deprecation
      severity: medium
      tier: free

  # ========================================
  # 🗄️ DATABASE / CACHE / ANALYTICS RETIREMENTS
  # ========================================

  # MEDIUM: PostgreSQL Flexible Server 11/12/13 in paid extended support (14 from Feb 1, 2027)
  - name: leftsize-postgresql-flexible-extended-support
    description: |
      Azure Database for PostgreSQL Flexible Server versions 11, 12 and 13 left Azure
      standard support on July 31, 2026. Servers were automatically enrolled in Extended
      Support on August 1, 2026 and Extended Support billing started September 1, 2026.
      PostgreSQL 14 follows: standard support ends January 31, 2027, Extended Support
      (billed) starts February 1, 2027.

      You can't opt out of Extended Support except by upgrading to a supported major version.
      Billing applies only while the server is in a Succeeded (running) state.

      Extended Support end dates:
      - PostgreSQL 11: March 31, 2027
      - PostgreSQL 12: November 13, 2027
      - PostgreSQL 13: November 12, 2028
      - PostgreSQL 14: November 11, 2029

      Fix: in-place major version upgrade (`az postgres flexible-server upgrade --version <n>`).

      Reference: https://learn.microsoft.com/en-us/azure/postgresql/configure-maintain/extended-support

    resource: azure.postgresql-flexibleserver

    filters:
      - type: value
        key: properties.version
        op: in
        value:
          - '11'
          - '12'
          - '13'
          - '14'

    metadata:
      category: deprecation
      severity: medium
      tier: free

  # MEDIUM: MySQL Flexible Server 5.7 in paid extended support (8.0 from Feb 1, 2027)
  - name: leftsize-mysql-flexible-extended-support
    description: |
      Azure Database for MySQL Flexible Server 5.7 left Azure standard support on
      September 30, 2026. Servers still on 5.7 were automatically enrolled in Extended
      Support on October 1, 2026 and are charged per vCore per hour.
      MySQL 8.0 follows: standard support ends January 31, 2027, Extended Support (billed)
      starts February 1, 2027.

      Extended Support end dates:
      - MySQL 5.7: March 31, 2029
      - MySQL 8.0: May 31, 2029

      Stopped servers aren't charged; read replicas and HA standbys are billed for their vCores.
      Fix: in-place major version upgrade (`az mysql flexible-server upgrade --version 8.0|8.4`).

      Reference: https://learn.microsoft.com/en-us/azure/mysql/concepts-version-policy

    resource: azure.mysql-flexibleserver

    filters:
      # 5.7 and 8.0 (8.0 servers report e.g. '8.0.21'); 8.4 is not matched
      - type: value
        key: properties.version
        op: regex
        value: '^(5\.7|8\.0)(\..*)?$'

    metadata:
      category: deprecation
      severity: medium
      tier: free

  # HIGH: Azure Cache for Redis Enterprise / Enterprise Flash retire March 31, 2027
  - name: leftsize-redis-enterprise-retirement
    description: |
      All Azure Cache for Redis Enterprise and Enterprise Flash instances retire on
      March 31, 2027. Instances are disabled starting April 1, 2027.
      Migrate to Azure Managed Redis (self-service migration or Microsoft migration tooling).

      Azure Managed Redis uses the same resource type (Microsoft.Cache/redisEnterprise) with
      Balanced_/MemoryOptimized_/ComputeOptimized_/FlashOptimized_ SKUs, so only
      Enterprise_* and EnterpriseFlash_* SKUs are matched.
      No typed c7n resource exists for redisEnterprise, so the generic ARM resource is used
      (resources.list returns the top-level sku).

      Timeline:
      - March 31, 2027: RETIREMENT DATE
      - April 1, 2027: Remaining Enterprise instances disabled

      Reference: https://learn.microsoft.com/en-us/azure/azure-cache-for-redis/retirement-faq

    resource: azure.armresource

    filters:
      - type: resource-type
        values:
          - Microsoft.Cache/redisEnterprise

      - type: value
        key: sku.name
        op: regex
        value: '^(Enterprise|EnterpriseFlash)_.*$'

    metadata:
      category: deprecation
      severity: high
      tier: free

  # MEDIUM: Azure Cache for Redis Basic / Standard / Premium retire September 30, 2028
  - name: leftsize-redis-cache-retirement
    description: |
      All Azure Cache for Redis Basic, Standard and Premium instances retire on
      September 30, 2028. Remaining instances are disabled starting October 1, 2028.
      Existing reservations are supported until September 30, 2028.
      Migrate to Azure Managed Redis (self-service migration recommended; migration
      tooling in preview).

      azure.redis enumerates Microsoft.Cache/Redis only (Basic/Standard/Premium); Enterprise
      tiers are covered by leftsize-redis-enterprise-retirement.

      Timeline:
      - September 30, 2028: RETIREMENT DATE
      - October 1, 2028: Remaining instances disabled

      Reference: https://learn.microsoft.com/en-us/azure/azure-cache-for-redis/retirement-faq

    resource: azure.redis

    metadata:
      category: deprecation
      severity: medium
      tier: free

  # CRITICAL: HDInsight 4.0 and 5.0 were retired on March 31, 2025
  - name: leftsize-hdinsight-retired-version
    description: |
      HDInsight 4.0 and 5.0 reached end of support and retirement on March 31, 2025.

      For retired versions: no support or maintenance (including security updates, bug fixes,
      scaling or performance improvements), no new clusters, and "Microsoft reserves the right
      to remove, disable, or delete all instances of retired versions of this service at any
      time after the retirement date".

      HDInsight has no in-place upgrade: create a new HDInsight 5.1 cluster, migrate jobs,
      and delete the old cluster.

      Reference: https://learn.microsoft.com/en-us/azure/hdinsight/hdinsight-component-versioning

    resource: azure.hdinsight

    filters:
      # clusterVersion looks like '4.0.3000.1' / '5.0.3000.0'; 5.1 is supported
      - type: value
        key: properties.clusterVersion
        op: regex
        value: '^(4\.0|5\.0)(\..*)?$'

    metadata:
      category: deprecation
      severity: critical
      tier: free

  # ========================================
  # 📉 VM SIZE RETIREMENTS: SCALE SETS AND AKS NODE POOLS
  # ========================================
  # The leftsize-vm-* size retirement rules only scan azure.vm. Uniform scale
  # set instances and AKS nodes aren't azure.vm resources, so these two rules
  # cover the same five retirement groups on scale-set models and AKS node
  # pools. The five size regexes are identical to the azure.vm rules (M192i_v2
  # written as a regex instead of an 'in' list):
  #   M192i_v2                             2027-03-31
  #   NP / HC / HBv2                       2027-05-31
  #   D / Ds / Dv2 / Dsv2 / Ls             2028-05-01
  #   Av2 / Amv2 / Bv1 / F / Fs / Fsv2 /
  #   G / Gs / Lsv2                        2028-11-15
  #   Dv3 / Dsv3 / Ev3 / Esv3              2029-11-15
  # https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/lifecycle/retirements-and-capacity-restrictions

  - name: leftsize-vmss-retiring-size
    description: |
      Find Virtual Machine Scale Sets whose model (sku.name) uses a VM size
      that Microsoft retires between 2027 and 2029.

      Retirement dates (remaining VMs are deallocated, no SLA, no support):
      - Standard_M192is_v2 / M192ims_v2 / M192ids_v2 / M192idms_v2: March 31, 2027
      - NP, HC, HBv2: May 31, 2027
      - D, Ds, Dv2, Dsv2, Ls: May 1, 2028
      - Av2, Amv2, B (v1), F, Fs, Fsv2, G, Gs, Lsv2: November 15, 2028
      - Dv3, Dsv3, Ev3, Esv3: November 15, 2029
      Since July 2026 most of these series are under capacity growth
      restrictions (no extra quota, new subscriptions can't deploy them), so
      scale-out can fail before the retirement date.

      The fix is a scale-set model change (sku.name) followed by an instance
      upgrade/reimage according to the upgrade policy.

      Excluded: AKS-managed scale sets (any tag key starting with
      'aks-managed-', or the AKS naming pattern aks-<pool>-<number>-vmss).
      AKS node pools must be changed through the AKS API; they're covered by
      leftsize-aks-node-pool-retiring-size.
      Flexible scale sets without a VM profile have no sku and never match;
      their VMs are regular Microsoft.Compute/virtualMachines resources and are
      covered by the leftsize-vm-* rules. Scale sets with capacity 0 are
      reported: the model still points at the retiring size, so the next
      scale-out (or autoscale) would use it.

      References:
      - https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/lifecycle/retirements-and-capacity-restrictions
      - https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-upgrade-scale-set
      - https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-upgrade-policy
    resource: azure.vmss
    filters:
      - type: value
        key: properties.provisioningState
        op: ne
        value_type: normalize
        value: deleting
      # Scale-set model size in any of the five retirement groups
      - or:
          - type: value
            key: sku.name
            op: regex
            value: '^Standard_M192id?m?s_v2$'
          - type: value
            key: sku.name
            op: regex
            value: '^Standard_(NP\d+s|HC44(-\d+)?rs|HB120(-\d+)?rs_v2)$'
          - type: value
            key: sku.name
            op: regex
            value: '^Standard_(DS?\d+(-\d+)?|DS?\d+(-\d+)?_v2(_Promo)?|L\d+s)$'
          - type: value
            key: sku.name
            op: regex
            value: '^Standard_(A\d+m?_v2|B\d+(ls|s|ms)|F\d+s?|F\d+s_v2|GS?\d+(-\d+)?|L\d+s_v2)$'
          - type: value
            key: sku.name
            op: regex
            value: '^Standard_(D\d+s?_v3|E\d+(-\d+)?i?s?_v3)$'
      # Not an AKS node pool scale set (AKS sets Azure-created 'aks-managed-*'
      # tags on resources in the node resource group; name pattern as fallback)
      - not:
          - or:
              - type: value
                key: "keys(tags || `{}`)[?starts_with(@, 'aks-managed-')]"
                value: not-null
              - type: value
                key: name
                op: regex
                value: '^aks-[a-z0-9]+-\d+-vmss$'
    metadata:
      category: deprecation
      severity: high
      tier: free

  - name: leftsize-aks-node-pool-retiring-size
    description: |
      Find AKS clusters with at least one node pool (agentPoolProfiles[].vmSize)
      on a VM size that Microsoft retires between 2027 and 2029.

      Retirement dates (remaining VMs are deallocated, no SLA, no support):
      - Standard_M192is_v2 / M192ims_v2 / M192ids_v2 / M192idms_v2: March 31, 2027
      - NP, HC, HBv2: May 31, 2027
      - D, Ds, Dv2, Dsv2, Ls: May 1, 2028 (Standard_DS2_v2 was the AKS default)
      - Av2, Amv2, B (v1), F, Fs, Fsv2, G, Gs, Lsv2: November 15, 2028
      - Dv3, Dsv3, Ev3, Esv3: November 15, 2029
      Since July 2026 most of these series are under capacity growth
      restrictions, so node pool scale-out and upgrades (surge nodes) can fail
      before the retirement date.

      Remediation: add a node pool on a current size, cordon and drain the old
      pool, delete it (in-place resize of VMSS node pools is preview only).

      Limitation: Virtual Machines-type node pools list their sizes in
      virtualMachinesProfile.scale, which this rule doesn't check.

      References:
      - https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/lifecycle/retirements-and-capacity-restrictions
      - https://learn.microsoft.com/en-us/azure/aks/resize-node-pool
    resource: azure.aks
    filters:
      - type: value
        key: properties.provisioningState
        op: ne
        value_type: normalize
        value: deleting
      - type: list-item
        key: properties.agentPoolProfiles
        attrs:
          - or:
              - type: value
                key: vmSize
                op: regex
                value: '^Standard_M192id?m?s_v2$'
              - type: value
                key: vmSize
                op: regex
                value: '^Standard_(NP\d+s|HC44(-\d+)?rs|HB120(-\d+)?rs_v2)$'
              - type: value
                key: vmSize
                op: regex
                value: '^Standard_(DS?\d+(-\d+)?|DS?\d+(-\d+)?_v2(_Promo)?|L\d+s)$'
              - type: value
                key: vmSize
                op: regex
                value: '^Standard_(A\d+m?_v2|B\d+(ls|s|ms)|F\d+s?|F\d+s_v2|GS?\d+(-\d+)?|L\d+s_v2)$'
              - type: value
                key: vmSize
                op: regex
                value: '^Standard_(D\d+s?_v3|E\d+(-\d+)?i?s?_v3)$'
    metadata:
      category: deprecation
      severity: high
      tier: free
