# ========================================
# Azure Service Deprecations & Retirements
# ========================================
#
# This policy file contains rules for detecting Azure services, SKUs, and 
# features that are scheduled for deprecation or retirement by Microsoft.
#
# These are NOT cost optimization rules - they are mandatory migrations
# required to maintain service continuity.
#
# Category: deprecation, breaking-change, migration-required
# ========================================

policies:
  # ========================================
  # 🖥️ VIRTUAL MACHINE DEPRECATIONS
  # ========================================
  
  - name: leftsize-nvv4-series-retirement
    description: |
      Find VMs that still use a retired NVv3-series or NVv4-series size.

      Both series were retired on September 30, 2026. Remaining VMs were set to
      deallocated: they don't run, have no SLA or support, and can't start again
      until they are resized to a supported size. Managed disks of these VMs are
      still billed. (Exception: NVv3 in UAE North is extended to January 31, 2027.)

      Sizes:
      - NVv4 (AMD Radeon Instinct MI25): Standard_NV4as_v4, NV4ahs_v4, NV8as_v4,
        NV8ahs_v4, NV16as_v4, NV16ahs_v4, NV32as_v4, NV32ahs_v4
      - NVv3 (NVIDIA Tesla M60): Standard_NV12s_v3, NV12hs_v3, NV24s_v3,
        NV24ms_v3, NV32ms_v3, NV48s_v3

      Timeline:
      - April 15, 2025: Retirement announced
      - November 2, 2025: 1-year and 3-year RI purchases ended (NVv3 and NVv4)
      - June 2, 2026: Compute Pre-Purchase sales for NVv4 ended
      - September 30, 2026: RETIRED - VMs deallocated, no SLA, no support
      - January 31, 2027: NVv3 extension end date in UAE North only

      Recommended migration: NVads_V710_v5 / NVadsA10_v5 / NGads_V620 (NVv4);
      NVadsA10_v5 / NC_RTXPRO6000BSE_v6 / NCasT4_v3 (NVv3).
      Resizing NVv4 -> NVads_V710_v5 needs the AFEC feature
      'VMTempDiskResizePreview' registered on the subscription.

      All power states are flagged on purpose: after retirement the VMs are
      deallocated by Microsoft, which is exactly the state that needs action.

      References:
      - https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/lifecycle/retirement/nvv4-retirement
      - https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/lifecycle/retirement/nvv3-series-retirement
    resource: azure.vm
    filters:
      - type: value
        key: 'properties.hardwareProfile.vmSize'
        value_type: normalize
        op: 'in'
        value:
          # NVv4
          - 'standard_nv4as_v4'
          - 'standard_nv4ahs_v4'
          - 'standard_nv8as_v4'
          - 'standard_nv8ahs_v4'
          - 'standard_nv16as_v4'
          - 'standard_nv16ahs_v4'
          - 'standard_nv32as_v4'
          - 'standard_nv32ahs_v4'
          # NVv3
          - 'standard_nv12s_v3'
          - 'standard_nv12hs_v3'
          - 'standard_nv24s_v3'
          - 'standard_nv24ms_v3'
          - 'standard_nv32ms_v3'
          - 'standard_nv48s_v3'
    metadata:
      category: deprecation
      severity: critical
      tier: free

  # ========================================
  # ⚡ AZURE FUNCTIONS DEPRECATIONS
  # ========================================
  
  - name: leftsize-functions-linux-consumption-retirement
    description: |
      Detect App Service plans on the Linux Consumption (Y1 / Dynamic) hosting plan for Azure Functions.
      Microsoft retires Linux Consumption hosting on September 30, 2028; migrate to the Flex Consumption plan.

      Current state (verified 2026-10-04):
      - No new features and no new language versions are added to Linux Consumption.
        Last versions it will ever get: .NET 9 (isolated), Java 21, Node.js 22, Python 3.12, PowerShell 7.4.
        .NET 10, Node.js 24, Python 3.13+ and PowerShell 7.6 require Flex Consumption (or another plan).
      - Function apps still on the end-of-life v3 runtime on Linux Consumption stopped running after
        September 30, 2026 (they must move to the v4 runtime).
      - Windows Consumption is not affected.

      Timeline:
      - Now: no new features or language versions for Linux Consumption
      - September 30, 2026: v3-runtime apps on Linux Consumption stop running
      - September 30, 2028: RETIREMENT DATE - Linux Consumption hosting retired

      Migration: `az functionapp flex-migration list` / `az functionapp flex-migration start`
      (Flex Consumption has no deployment slots and does not support the .NET in-process model.)

      Detection: App Service plans with SKU Y1 that are Linux (kind contains "linux" or properties.reserved == true)
      and host at least one site. The v3 runtime (FUNCTIONS_EXTENSION_VERSION app setting) is not checked
      because reading app settings requires secret-level permissions.

      Reference: https://learn.microsoft.com/en-us/azure/azure-functions/migration/migrate-plan-consumption-to-flex
      Reference: https://learn.microsoft.com/en-us/azure/azure-functions/supported-languages

    resource: azure.appserviceplan

    metadata:
      category: deprecation
      severity: medium
      tier: free

    filters:
      # Linux Consumption hosting plan (Y1 / Dynamic SKU)
      - type: value
        key: 'sku.name'
        value: 'Y1'

      # Linux plan: either kind contains "linux" (portal/CLI-created plans) or
      # properties.reserved == true (Microsoft's Bicep/ARM samples omit kind and only set reserved)
      - or:
          - type: value
            key: 'kind'
            op: regex
            value: '.*linux.*'
          - type: value
            key: 'properties.reserved'
            value: true

      # Only plans that actually host function apps
      - type: value
        key: 'properties.numberOfSites'
        op: gt
        value: 0

  # ========================================
  # ☸️ AKS KUBERNETES VERSION DEPRECATIONS
  # ========================================

  - name: leftsize-aks-outdated-version
    description: |
      Find AKS clusters (control plane or any node pool) on a Kubernetes minor
      version that is out of AKS community support, or whose support ends by
      November 30, 2026.

      AKS release calendar (verified 2026-10-04, page updated 2026-09-15):
      - 1.32 and older: end of life (1.32 ended Mar 2026)
      - 1.33: end of life Jul 2026; platform support only until 1.37 GA (Oct 2026)
      - 1.34: end of life Nov 2026 (Nov 30, 2026)
      - 1.35 (EOL Mar 2027), 1.36 (EOL Jun 2027), 1.37 (EOL Oct 2027): supported

      Clusters with the paid Long Term Support plan (Premium tier) get one
      extra year (1.31 LTS ends Nov 2026, 1.32 Mar 2027, 1.33 Jul 2027). The
      API version Cloud Custodian uses does not expose supportPlan, so LTS
      clusters are also flagged; the issue explains how to check.

      MAINTENANCE: update the regex when the next minor version approaches
      end of life (1.35 ends Mar 2027).

      Reference: https://learn.microsoft.com/en-us/azure/aks/supported-kubernetes-versions

    resource: azure.aks

    filters:
      # Skip clusters that are being deleted
      - type: value
        key: properties.provisioningState
        op: ne
        value_type: normalize
        value: deleting
      - or:
          # Control plane version: matches "1.34" as well as "1.34.2" (any patch)
          - type: value
            key: properties.kubernetesVersion
            op: regex
            value: '^1\.([0-9]|[12][0-9]|3[0-4])(\..*)?$'
          # Node pools can lag behind the control plane
          - type: list-item
            key: properties.agentPoolProfiles
            attrs:
              - type: value
                key: orchestratorVersion
                op: regex
                value: '^1\.([0-9]|[12][0-9]|3[0-4])(\..*)?$'

    metadata:
      category: deprecation
      severity: high
      tier: free

  # ========================================
  # 🗄️ SQL DATABASE DTU MODEL (Legacy)
  # ========================================

  - name: leftsize-sql-database-dtu-model
    description: |
      Find Azure SQL Databases using the legacy DTU purchasing model.
      
      The DTU model is being phased out in favor of vCore:
      - DTU: Legacy, less flexible, harder to right-size
      - vCore: Modern, more control, reserved capacity discounts
      
      Benefits of migrating to vCore:
      - Up to 55% savings with reserved capacity
      - More granular compute/storage sizing
      - Hybrid benefit support (use existing SQL licenses)
      - Better performance predictability
      
      Reference: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tiers-dtu
    
    resource: azure.sql-database
    
    filters:
      # DTU-based SKUs (Basic, Standard S0-S12, Premium P1-P15)
      - type: value
        key: 'sku.tier'
        op: in
        value:
          - 'Basic'
          - 'Standard'
          - 'Premium'
      # Exclude system databases
      - type: value
        key: 'name'
        op: ne
        value: 'master'

  # ========================================
  # 🌐 APPLICATION GATEWAY DEPRECATIONS
  # ========================================

  # CRITICAL: Azure Application Gateway v1 retiring April 28, 2026
  # CRITICAL: Azure Application Gateway v1 was retired on April 28, 2026
  - name: leftsize-appgateway-v1-deprecated
    description: |
      CRITICAL: Azure Application Gateway V1 (Standard and WAF v1 SKUs) was retired on April 28, 2026.

      Microsoft no longer supports V1 resources and there's no SLA. As Microsoft
      decommissions the hardware that supports V1, traffic through remaining V1
      gateways can't be guaranteed: remaining deployments can experience traffic
      disruptions as Microsoft blocks the data path and deletes the resources.
      Microsoft notifies customers of the deletion timeline and then deletes
      deployments that weren't migrated to V2.

      Timeline:
      - April 28, 2023: Deprecation announced
      - July 1, 2023: No new V1 deployments for new subscriptions
      - September 1, 2024: V1 creation stopped for all customers
      - April 28, 2026: RETIREMENT DATE - unsupported, no SLA, data path blocked and resources deleted after notification

      V1 SKU Names (affected):
      - Standard_Small, Standard_Medium, Standard_Large
      - WAF_Medium, WAF_Large

      V2 SKU Names (target):
      - Standard_v2
      - WAF_v2 (then upgrade the legacy WAF configuration to a WAF policy)

      Migration path:
      - Enhanced cloning script AzureAppGWClone (recommended) clones the V1 config to a new V2 gateway
      - Public IP retention script AzureAppGWIPMigrate moves the V1 public IP to V2 (1-5 min downtime)
      - V1 gateways aren't automatically upgraded to V2

      Reference: https://learn.microsoft.com/en-us/azure/application-gateway/v1-retirement

    resource: azure.application-gateway

    filters:
      # Match V1 SKU names (Standard and WAF without _v2 suffix)
      - type: value
        key: 'properties.sku.name'
        op: 'in'
        value:
          - 'Standard_Small'
          - 'Standard_Medium'
          - 'Standard_Large'
          - 'WAF_Medium'
          - 'WAF_Large'

    metadata:
      category: deprecation
      severity: critical
      tier: free

    actions:
      - type: tag
        tag: 'leftsize-deprecation'
        value: 'appgateway-v1-eol-apr-2026'
      
      - type: tag
        tag: 'leftsize-severity'
        value: 'critical'
      
      - type: tag
        tag: 'leftsize-action-required'
        value: 'migrate-to-v2'
      
      - type: tag
        tag: 'leftsize-retirement-date'
        value: '2026-04-28'
      
      - type: tag
        tag: 'leftsize-detected-date'
        value: '{now:%Y-%m-%d}'
      
      - type: tag
        tag: leftsize-appgateway-v1-deprecated-notify
        value: 'leftsize-flagged'

  # ========================================
  # 💿 STANDARD HDD OS DISK RETIREMENT
  # ========================================

  - name: leftsize-hdd-os-disk-retirement
    description: |
      Detect Azure Managed Disks using Standard HDD (Standard_LRS) as OS disks.
      
      Microsoft is retiring the ability to use Standard HDD disks as OS disks
      on September 8, 2028. After that date, all Standard HDD OS disks will be
      automatically converted to Standard SSD disks of equivalent size.
      
      This automatic conversion may cause service disruptions. To avoid potential
      issues, proactively migrate your Standard HDD OS disks before the deadline.
      
      Recommended migration targets:
      - Standard SSD (Standard_LRS → StandardSSD_LRS): Closest price-to-performance ratio
      - Premium SSD (Standard_LRS → Premium_LRS): For workloads requiring higher performance
      
      Timeline:
      - Now: Stop creating new VMs with Standard HDD OS disks
      - Before September 8, 2028: Migrate all existing Standard HDD OS disks
      - September 8, 2028: RETIREMENT DATE — automatic conversion to Standard SSD
      
      Note: This retirement only affects OS disks. Standard HDD data disks and
      ephemeral OS disks are NOT affected.
      
      Reference: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-hdd-os-retirement
    
    resource: azure.disk
    
    filters:
      # Standard HDD SKU
      - type: value
        key: 'sku.name'
        value: 'Standard_LRS'
      
      # Is an OS disk (has osType set)
      - type: value
        key: 'properties.osType'
        op: not-equal
        value: null
    
    actions:
      - type: tag
        tag: 'leftsize-deprecation'
        value: 'hdd-os-disk-eol-sep-2028'
      
      - type: tag
        tag: 'leftsize-severity'
        value: 'medium'
      
      - type: tag
        tag: 'leftsize-action-required'
        value: 'migrate-to-standard-ssd'
      
      - type: tag
        tag: 'leftsize-retirement-date'
        value: '2028-09-08'
      
      - type: tag
        tag: 'leftsize-detected-date'
        value: '{now:%Y-%m-%d}'
      
      - type: tag
        tag: leftsize-hdd-os-disk-retirement-notify
        value: 'leftsize-flagged'

  # ========================================
  # 🗄️ SERVICE DEPRECATIONS (Sep 2025)
  # ========================================

  # CRITICAL: Azure Database for MariaDB retiring September 19, 2025
  # CRITICAL: Azure Database for MariaDB was retired on September 19, 2025
  - name: leftsize-mariadb-deprecated
    description: |
      CRITICAL: Azure Database for MariaDB was retired on September 19, 2025.

      Microsoft's lifecycle page: after the end date these products no longer receive
      security updates, non-security updates, bug fixes, or technical support.
      Microsoft Q&A answers (learn.microsoft.com/answers, not product documentation) report
      that retired servers were shut down and that resources and automated backups are
      deleted after retirement; data recovery was only possible by exception via support.

      If this scan still lists a MariaDB server, the ARM resource still exists: export the
      data immediately (or open a support request if the server is no longer reachable),
      then migrate to Azure Database for MySQL - Flexible Server and delete the server.

      Migration path:
      - Azure Database for MySQL - Flexible Server (recommended)
      - Azure Database for PostgreSQL - Flexible Server (requires schema/application changes)
      - Self-hosted MariaDB on Azure VMs (if MariaDB-specific features are required)

      Reference: https://learn.microsoft.com/en-us/lifecycle/announcements/azure-products-retirement-september-2025

    resource: azure.mariadb-server

    filters:
      # Match all MariaDB servers - the entire service is retired
      - type: value
        key: name
        op: not-equal
        value: ''

    metadata:
      category: deprecation
      severity: critical
      tier: free

    actions:
      - type: tag
        tag: 'leftsize-deprecation'
        value: 'mariadb-eol-sep-2025'
      
      - type: tag
        tag: 'leftsize-severity'
        value: 'critical'
      
      - type: tag
        tag: 'leftsize-action-required'
        value: 'migrate-to-mysql-flexible'
      
      - type: tag
        tag: 'leftsize-detected-date'
        value: '{now:%Y-%m-%d}'
      
      - type: tag
        tag: leftsize-mariadb-deprecated-notify
        value: 'leftsize-flagged'

  # HIGH: Azure Basic Load Balancer retiring September 30, 2025
  # HIGH: Azure Basic Load Balancer was retired on September 30, 2025
  - name: leftsize-basic-loadbalancer-deprecated
    description: |
      Azure Basic Load Balancer was retired on September 30, 2025.

      Basic Load Balancers remain operational after the retirement date, but customers who
      keep using them "accept the risks and acknowledge that the service is unsupported and
      not covered by SLA guarantees". Upgrade to Standard Load Balancer as soon as possible.

      Migration path:
      - AzureBasicLoadBalancerUpgrade PowerShell module (recommended for supported scenarios;
        also upgrades the associated Basic public IPs)
      - Manual rebuild in the portal for unsupported scenarios

      Important: migration requires downtime and is one-way. Standard LB blocks outbound
      access by default (needs outbound rules or NAT Gateway) and Standard public IPs are
      closed to inbound traffic until an NSG allows it.
      Cloud Services (extended support) deployments are not affected by this retirement.

      Reference: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-basic-upgrade-guidance

    resource: azure.loadbalancer

    filters:
      # Match Basic SKU load balancers only
      - type: value
        key: sku.name
        value: 'Basic'

    metadata:
      category: deprecation
      severity: high
      tier: free

    actions:
      - type: tag
        tag: 'leftsize-deprecation'
        value: 'basic-lb-eol-sep-2025'
      
      - type: tag
        tag: 'leftsize-severity'
        value: 'high'
      
      - type: tag
        tag: 'leftsize-action-required'
        value: 'upgrade-to-standard-lb'
      
      - type: tag
        tag: 'leftsize-detected-date'
        value: '{now:%Y-%m-%d}'
      
      - type: tag
        tag: leftsize-basic-lb-deprecated-notify
        value: 'leftsize-flagged'

  # ========================================
  # 💿 UNMANAGED DISKS RETIREMENT (Mar 2026)
  # ========================================

  # CRITICAL: Azure Unmanaged Disks retiring March 31, 2026
  - name: leftsize-unmanaged-disks-retirement
    description: |
      Find VMs that still use unmanaged disks (VHD page blobs in a storage
      account) for the OS disk or any data disk.

      Unmanaged disks were fully retired on March 31, 2026 (extended from
      September 30, 2025; announced September 13, 2022). Since then you can't
      start IaaS VMs that use unmanaged disks, and running or allocated VMs with
      unmanaged disks were stopped and deallocated. The VHD data stays in the
      storage account (and keeps being billed) until you convert or delete it.

      All power states are flagged on purpose: a deallocated VM with unmanaged
      disks can't be started until it is converted to managed disks.

      Migration: deallocate, then `az vm convert` (CLI) or
      `ConvertTo-AzVMManagedDisk` (PowerShell). Availability sets must be
      converted to 'Aligned' first.

      Reference: https://learn.microsoft.com/en-us/azure/virtual-machines/unmanaged-disks-deprecation
    resource: azure.vm
    filters:
      - or:
          # OS disk is a VHD in a storage account
          - type: value
            key: 'properties.storageProfile.osDisk.vhd.uri'
            value: present
          # ...or at least one data disk is
          - type: value
            key: 'properties.storageProfile.dataDisks[].vhd.uri'
            value_type: size
            op: gt
            value: 0
    metadata:
      category: deprecation
      severity: critical
      tier: free

