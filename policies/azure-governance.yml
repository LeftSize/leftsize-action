# ========================================
# Azure Governance Policies
# ========================================
#
# Ownership tags, certificate expiry and other governance checks.
# Security checks (public access, encryption, network exposure, auditing)
# live in azure-security.yml.
#
# Category: governance (Team and Business plans)
# ========================================

policies:
  # ========================================
  # 🏷️ OWNERSHIP TAGS
  # ========================================

  - name: leftsize-missing-ownership-tags-vm
    description: |
      Ensure all virtual machines have clear ownership metadata for cost tracking and accountability.
      
      Resources without ownership tags create hidden spend, block cleanup, and prevent accurate
      cost allocation. This rule identifies VMs missing the required 'owner' tag.
      
      Detection criteria:
      - No 'owner' or 'Owner' tag, or the tag value is empty
      
      Governance impact: HIGH - Cost attribution, accountability, lifecycle management
      Compliance: FinOps best practices, cost allocation policies
    
    resource: azure.vm
    
    filters:
      # Flag only when neither 'owner' nor 'Owner' has a value. Azure treats tag
      # names as case-insensitive, but the API returns them as written.
      - or:
        - type: value
          key: 'tags.owner'
          value: absent
        - type: value
          key: 'tags.owner'
          value: ''
      - or:
        - type: value
          key: 'tags.Owner'
          value: absent
        - type: value
          key: 'tags.Owner'
          value: ''
    
    actions:
      - type: tag
        tag: 'leftsize-governance-issue'
        value: 'missing-ownership-tags'
      
      - type: tag
        tag: 'leftsize-severity'
        value: 'medium'
      
      - type: tag
        tag: 'leftsize-compliance'
        value: 'finops-tagging-policy'
      
      - type: tag
        tag: 'leftsize-detected-date'
        value: '{now:%Y-%m-%d}'
      
      - type: tag
        tag: leftsize-ownership-tags-notify
        value: 'leftsize-flagged'
    metadata:
      category: governance
      tier: pro

