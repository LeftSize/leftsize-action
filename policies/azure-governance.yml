  # ========================================
  # 📜 CERTIFICATE MANAGEMENT
  # ========================================

  # Key Vault certificates expiring within 30 days
  - name: leftsize-keyvault-cert-expiring
    description: |
      Identifies enabled Azure Key Vault certificates that expire within 30 days
      or have already expired.
      Expired certificates cause service authentication failures and outages.
      Proactive renewal prevents production incidents.
      
      This rule helps maintain operational continuity by alerting before expiry.
    resource: azure.keyvault-certificate
    filters:
      # Certificate is enabled
      # azure-keyvault-certificates 4.10 (pinned by c7n-azure) serializes the
      # attributes as {'data': {'enabled': bool, 'exp': <epoch seconds>}}
      - type: value
        key: attributes.data.enabled
        value: true
      # Certificate expires within 30 days (already expired certificates match too)
      - type: value
        key: attributes.data.exp
        value_type: expiration
        op: less-than
        value: 30
    metadata:
      category: governance
      severity: high
      tier: pro

  # ========================================
  # 💾 DISK RELIABILITY
  # ========================================

  # Standard HDD data disks attached to VMs: lower single-VM SLA than SSD
  - name: leftsize-standard-lrs-attached-disk
    description: |
      Find attached managed disks on Standard HDD (Standard_LRS) larger than 32 GB.

      This is a reliability hint, not a saving: Standard SSD usually costs somewhat
      more than Standard HDD, but gives more consistent latency, and a single-instance
      VM only gets Microsoft's highest uptime SLA when all its disks are Premium SSD or
      better (Standard SSD and HDD get lower SLAs).

      Reference: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-types
    resource: azure.disk
    filters:
      - type: value
        key: properties.diskState
        value: 'Attached'
      - type: value
        key: sku.name
        value: 'Standard_LRS'
      - type: value
        key: properties.diskSizeGB
        op: greater-than
        value: 32
    metadata:
      category: governance
      severity: low
      tier: pro
