# ========================================
# Cloudflare Deprecations & Retirements
# ========================================
#
# Features Cloudflare has deprecated or will remove. These are migrations, not
# cost savings. Runs with cloud-provider: cloudflare.
# ========================================

policies:
  - name: leftsize-cloudflare-page-rules-deprecated
    description: |
      Find active zones that still have Page Rules.

      Page Rules are deprecated and replaced by dedicated Rules products: Redirect
      Rules, Cache Rules, Configuration Rules, Origin Rules and Transform Rules.
      Cloudflare will migrate remaining Page Rules automatically and notify
      before changing anything, but has published no final date. Some settings
      are not migrated at all (Disable Performance, Disable Security, Disable
      Railgun, Response Buffering, Web Application Firewall), and migrated rules
      can behave differently: for Page Rules the first match wins, while
      Configuration, Cache and Origin Rules stack and the last change wins.
      Redirect Rules still use the first match (a redirect ends evaluation).

      Timeline:
      - 2022: replacement announced; new features only land in the new Rules
      - 2025 onward: automatic migration of remaining Page Rules, announced in
        advance (no end date published as of October 2026)

      Fix: recreate each Page Rule in its Rules product yourself (Cloudflare
      documents the replacement per setting), turn the Page Rule off, test, then
      delete it.

      References:
      - https://developers.cloudflare.com/rules/reference/page-rules-migration/
      - https://blog.cloudflare.com/future-of-page-rules/
    resource: cloudflare.zone
    filters:
      - type: value
        key: status
        value: active
      - type: page-rules
        count: 1
        op: gte
    metadata:
      category: deprecation
      severity: medium
      tier: pro
      review_by: '2027-04-30'

  - name: leftsize-cloudflare-zone-legacy-features
    description: |
      Find active zones that still have deprecated zone features configured.

      Currently checked: Auto Minify (CSS, HTML or JavaScript), deprecated on
      August 5, 2024 together with its API endpoints
      (GET/PATCH /zones/{zone_id}/settings/minify). Cloudflare advises turning
      it off; Terraform or scripts that still set it should be updated.

      Not checked: Firewall Rules and the previous Rate Limiting rules
      (deprecated June 15, 2025). Cloudflare already converted them to WAF
      custom rules and rate limiting rules, and their API endpoints now
      return 410 Gone.

      Fix: turn Auto Minify off (PATCH the minify setting with css, html and
      js set to off) and remove it from IaC.

      References:
      - https://developers.cloudflare.com/fundamentals/api/reference/deprecations/
      - https://developers.cloudflare.com/speed/optimization/content/troubleshooting/disable-auto-minify/
    resource: cloudflare.zone
    filters:
      - type: value
        key: status
        value: active
      - or:
          - type: zone-setting
            setting: minify
            key: value.css
            value: 'on'
          - type: zone-setting
            setting: minify
            key: value.html
            value: 'on'
          - type: zone-setting
            setting: minify
            key: value.js
            value: 'on'
    metadata:
      category: deprecation
      severity: low
      tier: pro
      review_by: '2027-04-30'

  - name: leftsize-cloudflare-workers-ai-deprecated-model
    description: |
      Find Workers AI models called in the last 14 days that Cloudflare is
      removing from the Workers AI catalog.

      Cloudflare deprecates 24 older models on November 20, 2026. After that
      date requests to them fail with HTTP 410 Gone (error code 5028), so the
      Workers, Pages projects or REST clients that call them break.

      Timeline:
      - 2026-11-05: deprecation announced (first date November 15, moved to
        November 20, 2026)
      - 2026-11-20: the models stop returning responses

      Suggested replacements (Cloudflare): melotts -> @cf/deepgram/aura-2-en;
      stable-diffusion-xl-base-1.0, stable-diffusion-v1-5-inpainting,
      stable-diffusion-xl-lightning and dreamshaper-8-lcm ->
      @cf/black-forest-labs/flux-2-klein-9b; whisper-tiny-en ->
      @cf/deepgram/nova-3; llava-1.5-7b-hf -> @cf/moondream/moondream3.1-9B-A2B;
      embeddinggemma-300m -> @cf/google/embeddinggemma-2 (available soon).
      LLMs: @cf/deepseek-ai/deepseek-v4.1-flash-1017 or @cf/zai-org/glm-5.3 for
      frontier needs, @cf/google/gemma-4-26b-a4b-it or @cf/qwen/qwen3.8-27b for
      smaller needs.

      Detection uses GraphQL Analytics (aiInferenceAdaptiveGroups) per account;
      it shows the request source (Worker binding, Pages binding, REST API) but
      not which Worker made the calls.

      References:
      - https://developers.cloudflare.com/changelog/post/2026-11-05-planned-model-deprecations/
    resource: cloudflare.ai-model
    filters:
      - type: value
        key: modelId
        op: in
        value_type: normalize
        value:
          - '@cf/myshell-ai/melotts'
          - '@cf/stabilityai/stable-diffusion-xl-base-1.0'
          - '@cf/runwayml/stable-diffusion-v1-5-inpainting'
          - '@cf/bytedance/stable-diffusion-xl-lightning'
          - '@cf/openai/whisper-tiny-en'
          - '@cf/llava-hf/llava-1.5-7b-hf'
          - '@cf/lykon/dreamshaper-8-lcm'
          - '@cf/google/embeddinggemma-300m'
          - '@cf/deepseek-ai/deepseek-r1-distill-qwen-32b'
          - '@cf/nvidia/nemotron-3-120b-a12b'
          - '@cf/deepseek-ai/deepseek-v4-pro-0813'
          - '@cf/deepseek-ai/deepseek-v4-flash-0731'
          - '@cf/qwen/qwq-32b'
          - '@cf/qwen/qwen3-30b-a3b-fp8'
          - '@cf/moonshotai/kimi-k2.6'
          - '@cf/moonshotai/kimi-k2.7-code'
          - '@cf/zai-org/glm-5.2'
          - '@cf/zai-org/glm-5.3-flash'
          - '@cf/meta-llama/llama-2-7b-chat-hf-lora'
          - '@cf/google/gemma-2b-it-lora'
          - '@cf/google/gemma-7b-it-lora'
          - '@cf/meta/llama-3.1-8b-instruct-fp8'
          - '@cf/meta/llama-3.2-1b-instruct'
          - '@cf/meta/llama-3.2-3b-instruct'
    metadata:
      category: deprecation
      severity: high
      tier: pro
      review_by: '2026-12-31'
      review_note: 'Models removed on 2026-11-20; add the next deprecation round or remove this rule'
