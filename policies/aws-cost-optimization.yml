policies:
  # ========================================
  # 📦 ECS / FARGATE
  # ========================================
  - name: leftsize-idle-ecs-container-instances
    description: |
      Find ECS capacity-provider Auto Scaling groups with a minimum of 3 or more
      instances. A high minimum keeps container instances running even when no
      tasks need them. This flags the configuration for review; it does not
      measure ECS utilization.
    resource: aws.asg
    filters:
      # ECS adds the AmazonECSManaged tag when the group backs a capacity provider
      # (https://docs.aws.amazon.com/AmazonECS/latest/developerguide/cluster-auto-scaling.html).
      # Customers can't create aws:-prefixed tags, so there is no cluster-name tag to match on.
      - type: value
        key: 'tag:AmazonECSManaged'
        value: present
      # Minimum capacity of 3 or more instances
      - type: value
        key: 'MinSize'
        op: gte
        value: 3
      # ASG has been active for at least 14 days
      - type: value
        key: 'CreatedTime'
        op: greater-than
        value_type: age
        value: 14
    actions:
      - type: tag
        key: leftsize-ecs-capacity-review
        value: 'check-for-idle-instances'

  - name: leftsize-fargate-spot-eligible
    description: "Find ECS services using regular Fargate that could use Fargate Spot for 70% savings"
    resource: aws.ecs-service
    filters:
      - type: value
        key: 'LaunchType'
        value: 'FARGATE'
      - or:
        - type: value
          key: 'tag:Environment'
          value: absent
        - not:
          - type: value
            key: 'tag:Environment'
            op: in
            value: ['prod', 'production', 'prd']
      # Services with multiple tasks (better for handling interruptions)
      - type: value
        key: 'desiredCount'
        op: gte
        value: 2
      # Service has been running for at least 7 days
      - type: value
        key: 'createdAt'
        op: greater-than
        value_type: age
        value: 7
    actions:
      - type: tag
        key: leftsize-fargate-spot-eligible
        value: 'review-for-spot-migration'

  # ========================================
  # 🖥️ EC2 INSTANCES
  # ========================================
  - name: leftsize-inactive-ec2-instance
    description: "Find inactive EC2 instances with low CPU and network utilization"
    resource: aws.ec2
    filters:
      # Only check running instances
      - type: value
        key: 'State.Name'
        value: 'running'
      # Instance must be running for at least 7 days
      - type: instance-age
        op: gte
        days: 7
      # Low CPU utilization (≤5% average over 7 days)
      - type: metrics
        name: CPUUtilization
        namespace: AWS/EC2
        dimensions:
          InstanceId: instance-id
        op: less-than
        value: 5
        statistics: Average
        days: 7
      # Low network output (minimal activity)
      - type: metrics
        name: NetworkOut
        namespace: AWS/EC2
        dimensions:
          InstanceId: instance-id
        op: less-than
        value: 1073741824  # 1GB total over 7 days
        statistics: Sum
        days: 7
    actions:
      - type: tag
        key: leftsize-inactive-ec2-stop
        value: 'leftsize-flagged'

  - name: leftsize-underutilized-ec2-instance
    description: "Find underutilized EC2 instances with low but non-zero CPU usage (right-sizing candidates)"
    resource: aws.ec2
    filters:
      # Only running instances
      - type: value
        key: 'State.Name'
        value: 'running'
      # Instance running for at least 14 days (need longer period for utilization trends)
      - type: instance-age
        op: gte
        days: 14
      # CPU utilization between 10-40% average over 14 days (underutilized but not idle)
      - and:
        - type: metrics
          name: CPUUtilization
          namespace: AWS/EC2
          dimensions:
            InstanceId: instance-id
          op: greater-than
          value: 10
          statistics: Average
          days: 14
        - type: metrics
          name: CPUUtilization
          namespace: AWS/EC2
          dimensions:
            InstanceId: instance-id
          op: less-than
          value: 40
          statistics: Average
          days: 14
      # Exclude burstable T-family instances (t2, t3, t3a, t4g, ...; designed for variable loads)
      - not:
        - type: value
          key: 'InstanceType'
          op: regex
          value: '^t[0-9][a-z]*\.'
      # Exclude instances already tagged as optimized
      - not:
        - type: value
          key: 'tag:RightSized'
          value: present
    actions:
      - type: tag
        key: leftsize-underutilized-ec2-review
        value: 'leftsize-flagged'

  - name: leftsize-multi-az-nonprod-ec2
    description: "Find non-production EC2 instances spread across multiple AZs (unnecessary HA)"
    resource: aws.ec2
    filters:
      # Only running instances
      - type: value
        key: 'State.Name'
        value: 'running'
      # Non-production environments
      - type: value
        key: 'Tags'
        value: present
      - or:
        - type: value
          key: 'tag:Environment'
          op: in
          value: ['dev', 'development', 'test', 'testing', 'staging', 'qa', 'sandbox']
        - type: value
          key: 'tag:Env'
          op: in
          value: ['dev', 'development', 'test', 'testing', 'staging', 'qa', 'sandbox']
      # Instance has been running for at least 7 days (avoid catching new deployments)
      - type: instance-age
        op: gte
        days: 7
    # Note: The policy will flag instances. Manual review needed to identify which AZs to consolidate.
    actions:
      - type: tag
        key: leftsize-multi-az-review
        value: 'leftsize-flagged'

  # ========================================
  # 💾 EBS VOLUMES
  # ========================================
  - name: leftsize-unattached-ebs-volume
    description: "Find unattached EBS volumes that can be deleted"
    resource: aws.ebs
    filters:
      # Volume is not attached to any instance
      - type: value
        key: 'State'
        value: 'available'
      # Volume is older than 7 days (avoid temporary detachments)
      - type: value
        key: 'CreateTime'
        op: greater-than
        value_type: age
        value: 7
      # Not a snapshot (those are handled separately)
      - not:
        - type: value
          key: 'SnapshotId'
          value: present
    actions:
      - type: tag
        key: leftsize-unattached-ebs-delete
        value: 'leftsize-flagged'

  # ========================================
  # 🌐 ELASTIC IPs
  # ========================================
  - name: leftsize-unused-elastic-ip
    description: "Find unused Elastic IP addresses that can be released"
    resource: aws.network-addr
    filters:
      # Not associated with any instance or network interface
      - type: value
        key: 'AssociationId'
        value: absent
    actions:
      - type: tag
        key: leftsize-unused-eip-release
        value: 'leftsize-flagged'

  # ========================================
  # 🗄️ RDS INSTANCES
  # ========================================
  - name: leftsize-idle-rds-instance
    description: "Find RDS instances with low connection and CPU utilization"
    resource: aws.rds
    filters:
      # aws.rds also returns DocumentDB and Neptune instances; this advice is for RDS/Aurora only
      - type: value
        key: 'Engine'
        op: not-in
        value: ['docdb', 'neptune']
      # Only check available (running) instances
      - type: value
        key: 'DBInstanceStatus'
        value: 'available'
      # Low CPU utilization (≤10% average over 7 days)
      - type: metrics
        name: CPUUtilization
        namespace: AWS/RDS
        op: less-than
        value: 10
        statistics: Average
        days: 7
      # Low database connections (≤1 average over 7 days)
      - type: metrics
        name: DatabaseConnections
        namespace: AWS/RDS
        op: less-than
        value: 1
        statistics: Average
        days: 7
    actions:
      - type: tag
        key: leftsize-idle-rds-stop
        value: 'leftsize-flagged'

  # ========================================
  # 🔄 LOAD BALANCERS
  # ========================================
  - name: leftsize-unused-load-balancer
    description: "Find load balancers with no active targets"
    resource: aws.elb
    filters:
      # No healthy targets
      - type: value
        key: 'Instances'
        value: []
      # Load balancer is older than 3 days
      - type: value
        key: 'CreatedTime'
        op: greater-than
        value_type: age
        value: 3
    actions:
      - type: tag
        key: leftsize-unused-elb-delete
        value: 'leftsize-flagged'

  - name: leftsize-unused-alb
    description: "Find Application Load Balancers with no active target groups"
    resource: aws.app-elb
    filters:
      # Load balancer is older than 3 days
      - type: value
        key: 'CreatedTime'
        op: greater-than
        value_type: age
        value: 3
      # Very low request count (effectively unused)
      - type: metrics
        name: RequestCount
        namespace: AWS/ApplicationELB
        op: less-than
        value: 10
        statistics: Sum
        days: 7
    actions:
      - type: tag
        key: leftsize-unused-alb-delete
        value: 'leftsize-flagged'

  # ========================================
  # 💰 COST OPTIMIZATION - Advanced Rules
  # ========================================

  - name: leftsize-orphaned-ebs-snapshots
    description: "Find EBS snapshots older than 30 days that should be reviewed for cleanup"
    resource: aws.ebs-snapshot
    filters:
      # Snapshot is older than 30 days
      - type: age
        days: 30
        op: gte
      # Owned by current account (not shared/public AMI snapshots)
      - type: value
        key: 'OwnerId'
        value: present
      # Note: VolumeId is always retained by AWS even after volume deletion,
      # so we cannot reliably detect true orphans via filters alone.
      # Template instructs users to verify source volume before deleting.
    actions:
      - type: tag
        key: leftsize-orphaned-snapshot-delete
        value: 'leftsize-flagged'

  - name: leftsize-ec2-outdated-generation
    description: "Find EC2 instances on older generations (4th gen or earlier) - 10-40% savings available"
    resource: aws.ec2
    filters:
      # Only running instances
      - type: value
        key: 'State.Name'
        value: 'running'
      # Older instance generations (m4, c4, r4, i2, d2, h1, etc.)
      - type: value
        key: 'InstanceType'
        op: regex
        value: '^(m[1-4]|c[1-4]|r[1-4]|i[1-2]|d2|h1|g3|p2|x1)\.'
      # Instance has been running for at least 7 days
      - type: instance-age
        op: gte
        days: 7
    actions:
      - type: tag
        key: leftsize-outdated-generation-review
        value: 'leftsize-flagged'

  - name: leftsize-ec2-scheduled-shutdown-missing
    description: "Find non-production EC2 instances running 24/7 without scheduled shutdown (30-70% savings)"
    resource: aws.ec2
    filters:
      # Only running instances
      - type: value
        key: 'State.Name'
        value: 'running'
      # Non-production environments based on tags
      - or:
        - type: value
          key: 'tag:Environment'
          op: in
          value: ['dev', 'development', 'test', 'testing', 'staging', 'qa', 'sandbox']
        - type: value
          key: 'tag:Env'
          op: in
          value: ['dev', 'development', 'test', 'testing', 'staging', 'qa', 'sandbox']
        - type: value
          key: 'tag:environment'
          op: in
          value: ['dev', 'development', 'test', 'testing', 'staging', 'qa', 'sandbox']
      # Not already tagged for scheduling
      - not:
        - or:
          - type: value
            key: 'tag:Schedule'
            value: present
          - type: value
            key: 'tag:AutoStop'
            value: present
          - type: value
            key: 'tag:StopSchedule'
            value: present
      # Instance has been running for at least 7 days
      - type: instance-age
        op: gte
        days: 7
    actions:
      - type: tag
        key: leftsize-schedule-review
        value: 'leftsize-flagged'

  - name: leftsize-s3-intelligent-tiering-missing
    description: "Find S3 buckets not using Intelligent-Tiering (40-70% savings on infrequent data)"
    resource: aws.s3
    filters:
      # Bucket exists
      - type: value
        key: 'Name'
        value: present
      # No intelligent-tiering configuration on this bucket
      - type: intelligent-tiering
        count: 0
        count_op: eq
    actions:
      - type: tag
        key: leftsize-intelligent-tiering-review
        value: 'leftsize-flagged'

  - name: leftsize-s3-missing-bucket-key
    description: "Find S3 buckets using SSE-KMS without Bucket Key enabled (reduces KMS API costs by 99%)"
    resource: aws.s3
    filters:
      # Bucket uses SSE-KMS encryption
      - type: bucket-encryption
        crypto: aws:kms
      # Bucket Key is not enabled
      - type: bucket-encryption
        bucket_key_enabled: false
    actions:
      - type: tag
        key: leftsize-bucket-key-review
        value: 'leftsize-flagged'

  - name: leftsize-s3-missing-lifecycle-policy
    description: "Find S3 buckets without lifecycle policies (30-70% storage savings possible)"
    resource: aws.s3
    filters:
      # Bucket exists
      - type: value
        key: 'Name'
        value: present
      # No lifecycle configuration - check if Lifecycle key is absent/empty
      - not:
        - type: value
          key: 'Lifecycle.Rules'
          value: present
      # Bucket is older than 30 days (established bucket)
      - type: value
        key: 'CreationDate'
        op: greater-than
        value_type: age
        value: 30
    actions:
      - type: tag
        key: leftsize-lifecycle-policy-review
        value: 'leftsize-flagged'

  - name: leftsize-gp2-to-gp3-migration
    description: "Find EBS volumes still using gp2 - migrate to gp3 for 20% savings and better performance"
    resource: aws.ebs
    filters:
      # Volume is gp2 type
      - type: value
        key: 'VolumeType'
        value: 'gp2'
      # Volume is in-use (attached to an instance)
      - type: value
        key: 'State'
        value: 'in-use'
      # Volume is older than 7 days
      - type: value
        key: 'CreateTime'
        op: greater-than
        value_type: age
        value: 7
    actions:
      - type: tag
        key: leftsize-gp3-migration-review
        value: 'leftsize-flagged'

  # ========================================
  # 💰 COST OPTIMIZATION - Batch 2
  # ========================================

  - name: leftsize-rds-outdated-version
    description: |
      Find RDS and Aurora DB instances on a major version that is past the end of
      standard support and is billed for RDS Extended Support right now.

      RDS / Aurora Extended Support is charged per vCPU-hour per DB instance
      (including Multi-AZ standbys), from the day after end of standard support.

      | Engine                       | End of standard support | Year 1 pricing | Year 3 pricing | End of Extended Support |
      |------------------------------|-------------------------|----------------|----------------|-------------------------|
      | RDS for MySQL 5.7            | 2024-02-29              | 2024-03-01     | 2026-03-01     | 2029-06-30              |
      | RDS for MySQL 8.0            | 2026-07-31              | 2026-08-01     | 2028-08-01     | 2029-07-31              |
      | RDS for PostgreSQL 12        | 2025-02-28              | 2025-03-01     | 2027-03-01     | 2028-02-29              |
      | RDS for PostgreSQL 13        | 2026-02-28              | 2026-03-01     | 2028-03-01     | 2029-02-28              |
      | Aurora MySQL 2 (MySQL 5.7)   | 2024-10-31              | 2024-12-01     | 2026-12-01     | 2029-06-30              |
      | Aurora PostgreSQL 12         | 2025-02-28              | 2025-03-01     | 2027-03-01     | 2028-02-29              |
      | Aurora PostgreSQL 13         | 2026-02-28              | 2026-03-01     | 2028-03-01     | 2029-02-28              |

      PostgreSQL 11 (forced upgrade 2027-03-31) is a separate rule:
      leftsize-rds-postgres11-end-of-extended-support.
      Aurora MySQL 3 (MySQL 8.0 compatible) stays in standard support until 2028-04-30
      and is NOT matched.

      References:
      - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/MySQL.Concepts.VersionMgmt.html
      - https://docs.aws.amazon.com/AmazonRDS/latest/PostgreSQLReleaseNotes/postgresql-release-calendar.html
      - https://docs.aws.amazon.com/AmazonRDS/latest/AuroraMySQLReleaseNotes/AuroraMySQL.release-calendars.html
      - https://docs.aws.amazon.com/AmazonRDS/latest/AuroraPostgreSQLReleaseNotes/aurorapostgresql-release-calendar.html
      - https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/extended-support-charges.html
    resource: aws.rds
    filters:
      # Skip instances that are being deleted or have failed
      - type: value
        key: 'DBInstanceStatus'
        op: not-in
        value: ['deleting', 'failed']
      # Instances explicitly opted out of Extended Support are force-upgraded, not billed
      - type: value
        key: 'EngineLifecycleSupport'
        op: ne
        value: 'open-source-rds-extended-support-disabled'
      # Engine + major version pairs that are in paid Extended Support today
      - or:
        - and:
          - type: value
            key: 'Engine'
            value: 'mysql'
          - type: value
            key: 'EngineVersion'
            op: regex
            value: '^(5\.7|8\.0)\..*$'
        - and:
          - type: value
            key: 'Engine'
            value: 'postgres'
          - type: value
            key: 'EngineVersion'
            op: regex
            value: '^1[23]\..*$'
        - and:
          # Aurora MySQL 2 reports versions like 5.7.mysql_aurora.2.11.2
          - type: value
            key: 'Engine'
            value: 'aurora-mysql'
          - type: value
            key: 'EngineVersion'
            op: regex
            value: '^5\.7\..*$'
        - and:
          - type: value
            key: 'Engine'
            value: 'aurora-postgresql'
          - type: value
            key: 'EngineVersion'
            op: regex
            value: '^1[23]\..*$'
    metadata:
      category: deprecation
      severity: high
      tier: free

  - name: leftsize-rds-multiaz-nonprod
    description: "Find non-production RDS instances with unnecessary Multi-AZ (2x cost)"
    resource: aws.rds
    filters:
      # aws.rds also returns DocumentDB and Neptune instances; this advice is for RDS/Aurora only
      - type: value
        key: 'Engine'
        op: not-in
        value: ['docdb', 'neptune']
      # Only available (running) instances
      - type: value
        key: 'DBInstanceStatus'
        value: 'available'
      # Multi-AZ enabled
      - type: value
        key: 'MultiAZ'
        value: true
      # Non-production environments based on tags
      - or:
        - type: value
          key: 'tag:Environment'
          op: in
          value: ['dev', 'development', 'test', 'testing', 'staging', 'qa', 'sandbox']
        - type: value
          key: 'tag:Env'
          op: in
          value: ['dev', 'development', 'test', 'testing', 'staging', 'qa', 'sandbox']
        - type: value
          key: 'tag:environment'
          op: in
          value: ['dev', 'development', 'test', 'testing', 'staging', 'qa', 'sandbox']
        # Or DB instance identifier contains non-prod keywords
        - type: value
          key: 'DBInstanceIdentifier'
          op: regex
          value: '(dev|test|staging|qa|sandbox)'
    actions:
      - type: tag
        key: leftsize-multiaz-review
        value: 'leftsize-flagged'

  - name: leftsize-rds-non-graviton
    description: "Find RDS instances using x86 instead of Graviton (20-40% savings)"
    resource: aws.rds
    filters:
      # Only available (running) instances
      - type: value
        key: 'DBInstanceStatus'
        value: 'available'
      # Graviton-compatible engines (MySQL, PostgreSQL, MariaDB)
      - type: value
        key: 'Engine'
        op: in
        value: ['mysql', 'postgres', 'mariadb']
      # x86 instance classes (not Graviton - db.*.g)
      - not:
        - type: value
          key: 'DBInstanceClass'
          op: regex
          value: 'db\.[a-z]+[0-9]+g\.'
      # Current generation instances only (m5, m6i, r5, r6i, t3)
      - type: value
        key: 'DBInstanceClass'
        op: regex
        value: 'db\.(m[56]i?|r[56]i?|t3)\.'
    actions:
      - type: tag
        key: leftsize-graviton-review
        value: 'leftsize-flagged'

  - name: leftsize-rds-excessive-backup-retention
    description: "Find non-production RDS instances with backup retention exceeding 14 days"
    resource: aws.rds
    filters:
      # aws.rds also returns DocumentDB and Neptune instances; this advice is for RDS/Aurora only
      - type: value
        key: 'Engine'
        op: not-in
        value: ['docdb', 'neptune']
      # Only available (running) instances
      - type: value
        key: 'DBInstanceStatus'
        value: 'available'
      # Backup retention period > 14 days
      - type: value
        key: 'BackupRetentionPeriod'
        op: greater-than
        value: 14
      # Non-production environments based on tags or identifier
      - or:
        - type: value
          key: 'tag:Environment'
          op: in
          value: ['dev', 'development', 'test', 'testing', 'staging', 'qa', 'sandbox']
        - type: value
          key: 'tag:Env'
          op: in
          value: ['dev', 'development', 'test', 'testing', 'staging', 'qa', 'sandbox']
        - type: value
          key: 'tag:environment'
          op: in
          value: ['dev', 'development', 'test', 'testing', 'staging', 'qa', 'sandbox']
        # Or DB instance identifier contains non-prod keywords
        - type: value
          key: 'DBInstanceIdentifier'
          op: regex
          value: '(dev|test|staging|qa|sandbox)'
    actions:
      - type: tag
        key: leftsize-backup-retention-review
        value: 'leftsize-flagged'

  - name: leftsize-rds-suboptimal-storage-type
    description: "Find RDS instances using io1/io2 when gp3 would provide sufficient IOPS at lower cost"
    resource: aws.rds
    filters:
      # aws.rds also returns DocumentDB and Neptune instances; this advice is for RDS/Aurora only
      - type: value
        key: 'Engine'
        op: not-in
        value: ['docdb', 'neptune']
      # Only available (running) instances
      - type: value
        key: 'DBInstanceStatus'
        value: 'available'
      # Using io1 or io2 storage type
      - type: value
        key: 'StorageType'
        op: in
        value: ['io1', 'io2']
      # IOPS is within gp3 range (gp3 supports up to 16,000 IOPS)
      - type: value
        key: 'Iops'
        op: less-than
        value: 16000
      # Instance has been running for at least 14 days
      - type: value
        key: 'InstanceCreateTime'
        op: greater-than
        value_type: age
        value: 14
    actions:
      - type: tag
        key: leftsize-rds-storage-review
        value: 'leftsize-flagged'

  - name: leftsize-lambda-x86-architecture
    description: "Find Lambda functions using x86 instead of ARM (20% savings)"
    resource: aws.lambda
    filters:
      # Default architecture is x86_64 (ARM is arm64)
      - or:
        - type: value
          key: 'Architectures'
          value: absent
        - type: value
          key: 'Architectures[0]'
          value: 'x86_64'
      # Exclude functions with custom runtimes (may need x86)
      - not:
        - type: value
          key: 'Runtime'
          op: in
          value: ['provided', 'provided.al2', 'provided.al2023']
      # Function has been invoked recently (active)
      - type: metrics
        name: Invocations
        namespace: AWS/Lambda
        dimensions:
          FunctionName: Name
        op: greater-than
        value: 0
        statistics: Sum
        days: 7
    actions:
      - type: tag
        key: leftsize-lambda-arm-review
        value: 'leftsize-flagged'

  - name: leftsize-inactive-nat-gateway
    description: "Find NAT Gateways with no traffic (pure waste)"
    resource: aws.nat-gateway
    filters:
      # Only active gateways
      - type: value
        key: 'State'
        value: 'available'
      # No outbound traffic in 7 days
      - type: metrics
        name: BytesOutToDestination
        namespace: AWS/NATGateway
        dimensions:
          NatGatewayId: NatGatewayId
        op: equal
        value: 0
        statistics: Sum
        days: 7
      # Gateway is older than 7 days
      - type: value
        key: 'CreateTime'
        op: greater-than
        value_type: age
        value: 7
    actions:
      - type: tag
        key: leftsize-inactive-nat-delete
        value: 'leftsize-flagged'

  - name: leftsize-ebs-delete-on-termination-disabled
    description: "Find EBS volumes with DeleteOnTermination disabled that will orphan"
    resource: aws.ec2
    filters:
      # Only running instances
      - type: value
        key: 'State.Name'
        value: 'running'
      # Has EBS volumes with DeleteOnTermination=false
      - type: value
        key: 'BlockDeviceMappings[].Ebs.DeleteOnTermination'
        op: contains
        value: false
      # Instance has been running for at least 7 days
      - type: instance-age
        op: gte
        days: 7
    actions:
      - type: tag
        key: leftsize-delete-on-termination-review
        value: 'leftsize-flagged'

  - name: leftsize-ebs-attached-to-stopped-ec2
    description: "Find EBS volumes attached to stopped EC2 instances (still incurring full storage costs)"
    resource: aws.ebs
    filters:
      # Volume is attached (in-use)
      - type: value
        key: 'State'
        value: 'in-use'
      # Attached to a stopped instance
      - type: value
        key: 'Attachments[0].State'
        value: 'attached'
      # Check instance state via cross-resource filter
      - type: instance
        key: 'State.Name'
        value: 'stopped'
      # Volume has been attached to stopped instance for at least 7 days
      - type: value
        key: 'CreateTime'
        op: greater-than
        value_type: age
        value: 7
    actions:
      - type: tag
        key: leftsize-stopped-instance-storage-review
        value: 'leftsize-flagged'

  - name: leftsize-ec2-non-graviton
    description: "Find EC2 instances not using Graviton processors (20-40% cost savings available)"
    resource: aws.ec2
    filters:
      # Only running instances
      - type: value
        key: 'State.Name'
        value: 'running'
      # Instance running for at least 14 days (established workload)
      - type: instance-age
        op: gte
        days: 14
      # Current x86 generation instances that have Graviton alternatives
      # Matches: m5, m6i, c5, c6i, r5, r6i, t3 (but not t4g which is already Graviton)
      - type: value
        key: 'InstanceType'
        op: regex
        value: '^(m[56]i?|c[56]i?|r[56]i?|t3)\.'
      # Exclude instances already using Graviton (g suffix)
      - not:
        - type: value
          key: 'InstanceType'
          op: regex
          value: '^(m[67]g|c[67]g|r[67]g|t4g)\.'
    actions:
      - type: tag
        key: leftsize-graviton-migration-review
        value: 'leftsize-flagged'

  - name: leftsize-io1-to-io2-migration
    description: "Find EBS volumes using io1 - migrate to io2 for better durability at the same price"
    resource: aws.ebs
    filters:
      # Volume is io1 type
      - type: value
        key: 'VolumeType'
        value: 'io1'
      # Volume is in-use (attached)
      - type: value
        key: 'State'
        value: 'in-use'
      # Volume is older than 7 days
      - type: value
        key: 'CreateTime'
        op: greater-than
        value_type: age
        value: 7
    actions:
      - type: tag
        key: leftsize-io2-migration-review
        value: 'leftsize-flagged'

  # ========================================
  # 💰 COST OPTIMIZATION - PointFive Inspired
  # ========================================

  - name: leftsize-spot-instance-eligible
    description: "Find on-demand EC2 instances in non-prod that could use Spot (60-90% savings)"
    resource: aws.ec2
    filters:
      # Only running instances
      - type: value
        key: 'State.Name'
        value: 'running'
      # On-demand instances only (InstanceLifecycle is absent or null for on-demand)
      - or:
        - type: value
          key: 'InstanceLifecycle'
          value: absent
        - type: value
          key: 'InstanceLifecycle'
          value: null
      # Non-production environments based on tags
      - or:
        - type: value
          key: 'tag:Environment'
          op: in
          value: ['dev', 'development', 'test', 'testing', 'staging', 'qa', 'sandbox']
        - type: value
          key: 'tag:Env'
          op: in
          value: ['dev', 'development', 'test', 'testing', 'staging', 'qa', 'sandbox']
        - type: value
          key: 'tag:environment'
          op: in
          value: ['dev', 'development', 'test', 'testing', 'staging', 'qa', 'sandbox']
      # Instance has been running for at least 7 days (established workload)
      - type: instance-age
        op: gte
        days: 7
      # Exclude instances that are spot-ineligible by design (e.g., stateful workloads)
      - not:
        - type: value
          key: 'tag:SpotIneligible'
          value: present
    actions:
      - type: tag
        key: leftsize-spot-eligible-review
        value: 'leftsize-flagged'

  - name: leftsize-s3-incomplete-multipart-uploads
    description: "Find S3 buckets without lifecycle rule to abort incomplete multipart uploads"
    resource: aws.s3
    filters:
      # Bucket exists
      - type: value
        key: 'Name'
        value: present
      # No lifecycle rule for incomplete multipart uploads
      # We check if AbortIncompleteMultipartUpload is absent in all rules
      - or:
        # No lifecycle rules at all
        - not:
          - type: value
            key: 'Lifecycle.Rules'
            value: present
        # Or lifecycle rules exist but none have AbortIncompleteMultipartUpload
        - type: value
          key: 'Lifecycle.Rules[].AbortIncompleteMultipartUpload'
          value: absent
      # Bucket is older than 30 days
      - type: value
        key: 'CreationDate'
        op: greater-than
        value_type: age
        value: 30
    actions:
      - type: tag
        key: leftsize-multipart-cleanup-review
        value: 'leftsize-flagged'

  - name: leftsize-s3-non-current-versions
    description: "Find versioned S3 buckets without lifecycle rule to expire old versions"
    resource: aws.s3
    filters:
      # Bucket has versioning enabled
      - type: value
        key: 'Versioning.Status'
        value: 'Enabled'
      # No lifecycle rule for non-current version expiration
      - or:
        # No lifecycle rules at all
        - not:
          - type: value
            key: 'Lifecycle.Rules'
            value: present
        # Or lifecycle rules exist but none have NoncurrentVersionExpiration
        - type: value
          key: 'Lifecycle.Rules[].NoncurrentVersionExpiration'
          value: absent
      # Bucket is older than 30 days
      - type: value
        key: 'CreationDate'
        op: greater-than
        value_type: age
        value: 30
    actions:
      - type: tag
        key: leftsize-version-cleanup-review
        value: 'leftsize-flagged'

  - name: leftsize-missing-vpc-endpoint-s3
    description: "Find VPCs without S3 Gateway Endpoint (causes unnecessary data transfer costs)"
    resource: aws.vpc
    filters:
      # VPC is active (has instances or resources)
      - type: value
        key: 'State'
        value: 'available'
      # Exclude default VPCs as they may be unused
      - type: value
        key: 'IsDefault'
        value: false
      # No S3 Gateway endpoint configured
      - not:
        - type: vpc-endpoint
          key: 'ServiceName'
          op: regex
          value: '.*\.s3$'
    actions:
      - type: tag
        key: leftsize-s3-endpoint-review
        value: 'leftsize-flagged'

  - name: leftsize-rds-auto-restart-pending
    description: "Find stopped RDS instances approaching 7-day auto-restart limit"
    resource: aws.rds
    filters:
      # aws.rds also returns DocumentDB and Neptune instances; this advice is for RDS/Aurora only
      - type: value
        key: 'Engine'
        op: not-in
        value: ['docdb', 'neptune']
      # Instance is stopped
      - type: value
        key: 'DBInstanceStatus'
        value: 'stopped'
      # No database connections in the last 5 days (confirms truly idle, not just temporarily stopped)
      - type: metrics
        name: DatabaseConnections
        namespace: AWS/RDS
        statistics: Sum
        days: 5
        value: 1
        op: less-than
        missing-value: 0
    actions:
      - type: tag
        key: leftsize-rds-auto-restart-warning
        value: 'leftsize-flagged'

  - name: leftsize-orphaned-rds-snapshots
    description: "Find manual RDS snapshots where the source database no longer exists"
    resource: aws.rds-snapshot
    filters:
      # Only manual snapshots (not automated backups)
      - type: value
        key: 'SnapshotType'
        value: 'manual'
      # Snapshot is available
      - type: value
        key: 'Status'
        value: 'available'
      # Snapshot is older than 30 days (proxy for orphan detection)
      - type: age
        days: 30
        op: greater-than
    actions:
      - type: tag
        key: leftsize-orphaned-rds-snapshot-delete
        value: 'leftsize-flagged'

  # ========================================
  # 🐳 CONTAINER REGISTRY OPTIMIZATION
  # ========================================

  # ECR repositories without lifecycle policy - accumulating old images
  - name: leftsize-ecr-no-lifecycle-policy
    description: |
      Identifies ECR repositories without a lifecycle policy configured.
      Without lifecycle policies, old images accumulate indefinitely,
      increasing storage costs. Adding a policy to remove untagged or
      old images typically saves 50-90% on ECR storage costs.
      
      ECR charges $0.10/GB/month for storage.
    resource: aws.ecr
    filters:
      - type: lifecycle-rule
        state: false
    metadata:
      category: cost-optimization
      severity: medium
      tier: pro

  # ========================================
  # 📝 LOG & OBSERVABILITY OPTIMIZATION
  # ========================================

  # CloudWatch Log Groups without retention policy (infinite retention)
  - name: leftsize-cloudwatch-logs-no-retention
    description: |
      Identifies CloudWatch Log Groups with no retention policy (infinite retention).
      Without a retention policy, logs are kept forever, accumulating significant
      storage costs. Most logs only need 7-90 days retention for debugging.
      
      CloudWatch Logs charges $0.03/GB ingested + $0.03/GB/month storage.
    resource: aws.log-group
    filters:
      # No retention policy means retentionInDays is null/absent
      - type: value
        key: retentionInDays
        value: absent
    metadata:
      category: cost-optimization
      severity: medium
      tier: pro

  # ========================================
  # 🔐 SECRETS & CREDENTIALS OPTIMIZATION
  # ========================================

  # Secrets Manager secrets not accessed in 90 days
  - name: leftsize-secrets-manager-unused
    description: |
      Identifies AWS Secrets Manager secrets not accessed in the last 90 days.
      Unused secrets indicate deprecated applications or forgotten credentials.
      Each secret costs $0.40/month plus $0.05 per 10,000 API calls.
      
      Unused secrets are also a security risk and should be reviewed.
    resource: aws.secrets-manager
    filters:
      # Secret has not been accessed in 90 days
      - type: value
        key: LastAccessedDate
        value_type: age
        op: greater-than
        value: 90
    metadata:
      category: cost-optimization
      severity: low
      tier: pro

  # ========================================
  # 💰 COST OPTIMIZATION - Phase 2
  # ========================================

  - name: leftsize-ebs-io1-io2-overprovisioned
    description: "Find io1/io2 EBS volumes with IOPS < 16,000 that can migrate to gp3 for 30-50% savings"
    resource: aws.ebs
    filters:
      # Only io1 or io2 volume types
      - type: value
        key: 'VolumeType'
        op: in
        value: ['io1', 'io2']
      # Provisioned IOPS is under 16,000 (gp3 max)
      - type: value
        key: 'Iops'
        op: less-than
        value: 16000
      # Volume is in use (attached to an instance)
      - type: value
        key: 'State'
        value: 'in-use'
      # Volume is older than 7 days (avoid catching new provisioning)
      - type: value
        key: 'CreateTime'
        op: greater-than
        value_type: age
        value: 7
    actions:
      - type: tag
        key: leftsize-io1-io2-gp3-migration-review
        value: 'leftsize-flagged'

  # ========================================
  # 💰 COST OPTIMIZATION - Phase 3 (Zombie Resources)
  # ========================================

  - name: leftsize-unused-lambda-function
    description: "Find Lambda functions with zero invocations in 30 days (zombie functions)"
    resource: aws.lambda
    filters:
      # Zero invocations over 30 days
      - type: metrics
        name: Invocations
        namespace: AWS/Lambda
        dimensions:
          FunctionName: Name
        op: equal
        value: 0
        statistics: Sum
        days: 30
        missing-value: 0
      # Function is older than 30 days (avoid catching newly deployed functions)
      - type: value
        key: 'LastModified'
        op: greater-than
        value_type: age
        value: 30
    metadata:
      category: cost-optimization
      severity: low
      tier: pro

  - name: leftsize-idle-dynamodb-table
    description: "Find DynamoDB tables with zero read and write activity in 30 days"
    resource: aws.dynamodb-table
    filters:
      # Zero consumed read capacity over 30 days
      - type: metrics
        name: ConsumedReadCapacityUnits
        namespace: AWS/DynamoDB
        dimensions:
          TableName: TableName
        op: equal
        value: 0
        statistics: Sum
        days: 30
        missing-value: 0
      # Zero consumed write capacity over 30 days
      - type: metrics
        name: ConsumedWriteCapacityUnits
        namespace: AWS/DynamoDB
        dimensions:
          TableName: TableName
        op: equal
        value: 0
        statistics: Sum
        days: 30
        missing-value: 0
      # Table is older than 30 days
      - type: value
        key: 'CreationDateTime'
        op: greater-than
        value_type: age
        value: 30
    metadata:
      category: cost-optimization
      severity: medium
      tier: pro

  - name: leftsize-idle-elasticache-cluster
    description: "Find ElastiCache clusters with zero connections in 14 days"
    resource: aws.cache-cluster
    filters:
      # Zero current connections over 14 days
      - type: metrics
        name: CurrConnections
        namespace: AWS/ElastiCache
        dimensions:
          CacheClusterId: CacheClusterId
        op: equal
        value: 0
        statistics: Maximum
        days: 14
        missing-value: 0
      # Cluster is older than 14 days
      - type: value
        key: 'CacheClusterCreateTime'
        op: greater-than
        value_type: age
        value: 14
    metadata:
      category: cost-optimization
      severity: medium
      tier: pro

  # ========================================
  # 💰 COST OPTIMIZATION - Batch 3 (New Rules)
  # ========================================

  # A1 - Inactive EKS clusters with no nodegroups
  # Detects EKS clusters with no attached nodegroups consuming $73/mo in control plane costs
  - name: leftsize-inactive-eks-cluster
    description: "Find active EKS clusters with no nodegroups attached (control plane costs with zero workloads)"
    resource: aws.eks
    filters:
      # Cluster is active
      - type: value
        key: status
        value: ACTIVE
      # No nodegroups attached
      - type: value
        key: 'nodegroups'
        value: empty
    actions:
      - type: tag
        key: leftsize-inactive-eks
        value: 'no-nodegroups-review'

  # A3 - RDS read replicas with no read load
  # Detects read replicas with no database connections consuming full instance + storage costs
  - name: leftsize-inactive-rds-read-replica
    description: "Find RDS read replicas with no read load (zero connections in 14 days)"
    resource: aws.rds
    filters:
      # aws.rds also returns DocumentDB and Neptune instances; this advice is for RDS/Aurora only
      - type: value
        key: 'Engine'
        op: not-in
        value: ['docdb', 'neptune']
      # Instance is available
      - type: value
        key: DBInstanceStatus
        value: available
      # Is a read replica
      - type: value
        key: ReadReplicaSourceDBInstanceIdentifier
        op: ne
        value: null
      # No database connections in 14 days
      - type: metrics
        name: DatabaseConnections
        namespace: AWS/RDS
        dimensions:
          DBInstanceIdentifier: DBInstanceIdentifier
        statistics: Maximum
        days: 14
        value: 1
        op: less-than
    actions:
      - type: tag
        key: leftsize-inactive-replica
        value: 'no-read-load-review'

  # A4 - Inactive EFS filesystems with no IO
  # Detects EFS filesystems with no client connections over 14 days
  - name: leftsize-inactive-efs-filesystem
    description: "Find EFS filesystems with no client connections in 14 days (low usage, $0.30/GB-month waste)"
    resource: aws.efs
    filters:
      # Filesystem is available
      - type: value
        key: LifeCycleState
        value: available
      # No client connections in 14 days
      - type: metrics
        name: ClientConnections
        statistics: Sum
        days: 14
        value: 0
        op: eq
        missing-value: 0
    actions:
      - type: tag
        key: leftsize-inactive-efs
        value: 'no-io-review'

  # A5 - Network Load Balancers with no active flows
  # Detects NLBs with zero traffic consuming $16-20/mo fixed + LCU costs
  - name: leftsize-inactive-nlb
    description: "Find Network Load Balancers with no active flows in 14 days ($16+/mo waste)"
    resource: aws.app-elb
    filters:
      # Network Load Balancer type only
      - type: value
        key: Type
        value: network
      # Load balancer is active
      - type: value
        key: State.Code
        value: active
      # No active flows in 14 days
      - type: metrics
        name: ActiveFlowCount
        namespace: AWS/NetworkELB
        statistics: Sum
        days: 14
        value: 0
        op: eq
        missing-value: 0
    actions:
      - type: tag
        key: leftsize-inactive-nlb
        value: 'no-traffic-review'

  # A8 - Inactive VPC endpoints (interface type)
  # Detects interface VPC endpoints with no traffic ($7.30/mo/AZ waste)
  - name: leftsize-inactive-vpc-endpoint
    description: "Find interface VPC endpoints with no traffic (gateway endpoints are free, $7.30/mo/AZ for interface)"
    resource: aws.vpc-endpoint
    filters:
      # Interface type only (gateway endpoints are free)
      - type: value
        key: VpcEndpointType
        value: Interface
      # Endpoint is available
      - type: value
        key: State
        value: available
      # No traffic through the endpoint in 14 days
      - type: metrics
        name: BytesProcessed
        namespace: AWS/PrivateLinkEndpoints
        statistics: Sum
        days: 14
        value: 0
        op: equal
        missing-value: 0
    actions:
      - type: tag
        key: leftsize-inactive-vpc-endpoint
        value: 'no-traffic-review'

  # A12 - Lambda functions with oversized memory and low invocation
  # Detects functions with >1024MB memory but low usage (likely over-provisioned)
  - name: leftsize-lambda-oversized-memory
    description: "Find Lambda functions with >1024MB memory and low invocations (rightsizing candidates, not definitive)"
    resource: aws.lambda
    filters:
      # Memory size > 1024MB
      - type: value
        key: MemorySize
        op: greater-than
        value: 1024
      # Low invocations (< 1000 in 14 days)
      - type: metrics
        name: Invocations
        statistics: Sum
        days: 14
        value: 1000
        op: less-than
        missing-value: 0
    actions:
      - type: tag
        key: leftsize-lambda-oversized
        value: 'rightsizing-candidate'

  # A18 - ElastiCache clusters with low CPU utilization
  # Detects Redis/Memcached clusters with low CPU over 14 days (rightsizing candidates)
  - name: leftsize-elasticache-underutilized
    description: "Find ElastiCache clusters with low CPU (<5% avg over 14 days, rightsizing candidates)"
    resource: aws.cache-cluster
    filters:
      # Cluster is available
      - type: value
        key: CacheClusterStatus
        value: available
      # Low CPU utilization
      - type: metrics
        name: CPUUtilization
        namespace: AWS/ElastiCache
        dimensions:
          CacheClusterId: CacheClusterId
        statistics: Average
        days: 14
        value: 5
        op: less-than
    actions:
      - type: tag
        key: leftsize-elasticache-underutilized
        value: 'rightsizing-candidate'
