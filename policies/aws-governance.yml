# ========================================
# AWS Governance Policies
# ========================================
#
# Ownership tags, certificate expiry and other governance checks.
# Security checks (public access, encryption, network exposure, auditing)
# live in aws-security.yml.
#
# Category: governance (Team and Business plans)
# ========================================

policies:
  # ========================================
  # 🏷️ OWNERSHIP TAGS
  # ========================================

  - name: leftsize-missing-ownership-tags
    description: |
      Ensure all active resources have clear ownership metadata for cost tracking and accountability.
      
      Resources without ownership tags create hidden spend, block cleanup, and prevent accurate
      cost allocation. This rule identifies resources missing the required 'owner' tag.
      
      Detection criteria:
      - No 'owner' or 'Owner' tag, or the tag value is empty
      - This rule covers EC2 instances; sibling rules cover RDS instances,
        S3 buckets, EBS volumes and Classic Load Balancers
      
      Governance impact: HIGH - Cost attribution, accountability, lifecycle management
      Compliance: FinOps best practices, cost allocation policies
    
    resource: aws.ec2
    
    filters:
      # Flag only when neither 'owner' nor 'Owner' has a value.
      # AWS tag keys are case-sensitive, so both spellings are accepted.
      - or:
        - type: value
          key: 'tag:owner'
          value: absent
        - type: value
          key: 'tag:owner'
          value: ''
      - or:
        - type: value
          key: 'tag:Owner'
          value: absent
        - type: value
          key: 'tag:Owner'
          value: ''
    
    actions:
      - type: tag
        key: 'leftsize-governance-issue'
        value: 'missing-ownership-tags'
      
      - type: tag
        key: 'leftsize-severity'
        value: 'medium'
      
      - type: tag
        key: 'leftsize-compliance'
        value: 'finops-tagging-policy'
      
      - type: tag
        key: 'leftsize-detected-date'
        value: '{now:%Y-%m-%d}'
      
      - type: tag
        key: leftsize-ownership-tags-notify
        value: 'leftsize-flagged'
    metadata:
      category: governance
      tier: pro

