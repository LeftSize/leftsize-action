name: 'LeftSize Cloud Cost Optimization'
description: 'Dependabot for cloud waste: scan AWS, Azure and Cloudflare read-only and get GitHub issues for idle resources and retirements'
author: 'LeftSize'
branding:
  icon: 'cloud'
  color: 'blue'

inputs:
  # Mode selection
  mode:
    description: 'Action mode: scan (default) or stats'
    required: false
    default: 'scan'
  
  # Required inputs
  installation-id:
    description: 'GitHub App installation ID (from LeftSize onboarding)'
    required: true
  
  repository-token:
    description: 'Secure repository token (from LeftSize onboarding)'
    required: true
  
  # Backend configuration
  backend-url:
    description: 'LeftSize backend API URL (must be an https URL on a LeftSize domain)'
    required: false
    default: 'https://api.leftsize.com'
  
  # Stats mode inputs
  period:
    description: 'Stats period: 7d, 30d, 90d, or all; counts findings scans reported in that period (stats mode only)'
    required: false
    default: '30d'
  
  format:
    description: 'Output format: json or markdown (stats mode only)'
    required: false
    default: 'markdown'
  
  report:
    description: 'Markdown report type: summary, detailed (adds breakdowns by status and cloud), or executive (two lines) (stats mode only)'
    required: false
    default: 'summary'
  
  # Cloud provider configuration (scan mode)
  cloud-provider:
    description: 'Cloud provider to scan (azure, aws or cloudflare)'
    required: false
    default: 'azure'
  
  # Azure-specific inputs
  azure-subscription-ids:
    description: 'Azure subscription ID(s) used for scoping and currency detection. The scan covers the subscription selected by azure/login.'
    required: false
  
  # AWS-specific inputs
  aws-regions:
    description: 'Comma-separated AWS regions to scan, or "all" for every enabled region (empty = the region of the AWS login step)'
    required: false
  
  # Cloudflare-specific inputs
  cloudflare-api-token:
    description: 'Read-only Cloudflare API token (cloud-provider: cloudflare). Permissions: Zone Read, Zone Settings Read, Page Rules Read. Pass it from a secret; without it, CLOUDFLARE_API_TOKEN from the environment is used.'
    required: false

  cloudflare-account-ids:
    description: 'Comma-separated Cloudflare account IDs to scan (empty = every account the token can read)'
    required: false

  # Environment configuration
  environment-name:
    description: 'Environment of the scanned resources. Leave empty to detect it per resource from environment tags and resource / resource group names. Set one value for the whole scan (e.g. Production), or name=environment pairs for a subscription or account with several environments (e.g. "Freelance-NG-A=acceptance, Freelance-NG-P=production, *-dev-*=development"), matched against resource group and resource names. Values that are not an environment (such as the matrix label MAIN) are ignored.'
    required: false
  
  # Currency configuration
  currency:
    description: 'Currency code for cost display (e.g., EUR, USD, GBP). Auto-detected from Azure if not specified.'
    required: false
  
  # Policy configuration
  include-policies:
    description: 'Comma-separated rule categories to run: cost-optimization, deprecation, governance, security (empty = all)'
    required: false
  
  exclude-policies:
    description: 'Comma-separated rule names to skip, with or without the leftsize- prefix (e.g., leftsize-idle-vm,unused-public-ip)'
    required: false
  
  # Execution options
  verbose:
    description: 'Enable verbose logging'
    required: false
    default: 'false'

outputs:
  # Scan mode outputs
  findings-count:
    description: 'Total number of findings detected (scan mode)'
    value: ${{ steps.run.outputs.findings-count }}
  
  findings-submitted:
    description: 'Whether findings were successfully submitted to backend (scan mode)'
    value: ${{ steps.run.outputs.findings-submitted }}
  
  findings-json:
    description: 'JSON string of all findings (scan mode); empty array when larger than 512 KB, use findings-file then'
    value: ${{ steps.run.outputs.findings-json }}
  
  findings-file:
    description: 'Path of a JSON file with all findings (scan mode)'
    value: ${{ steps.run.outputs.findings-file }}
  
  failed-policies:
    description: 'JSON array of checks that did not run, e.g. because of a missing read permission (scan mode). Empty array when the scan was complete'
    value: ${{ steps.run.outputs.failed-policies }}
  
  limit-exceeded:
    description: 'Whether findings were not submitted because the plan repository limit was reached (scan mode)'
    value: ${{ steps.run.outputs.limit-exceeded }}
  
  # Stats mode outputs
  report:
    description: 'Generated report content (stats mode, markdown or json)'
    value: ${{ steps.run.outputs.report }}
  
  stats-json:
    description: 'Raw statistics as JSON (stats mode)'
    value: ${{ steps.run.outputs.stats-json }}
  
  fix-ratio:
    description: 'Percentage of findings no longer open (stats mode)'
    value: ${{ steps.run.outputs.fix-ratio }}
  
  potential-savings:
    description: 'Potential monthly savings (stats mode)'
    value: ${{ steps.run.outputs.potential-savings }}
  
  realized-savings:
    description: 'Realized monthly savings (stats mode)'
    value: ${{ steps.run.outputs.realized-savings }}
  
  currency:
    description: 'Currency code used for savings (stats mode, e.g., EUR, USD)'
    value: ${{ steps.run.outputs.currency }}
  
  currency-symbol:
    description: 'Currency symbol for display (stats mode, e.g., €, $)'
    value: ${{ steps.run.outputs.currency-symbol }}

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.11'
    
    - name: Cache pip dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-leftsize-${{ hashFiles(format('{0}/requirements.txt', github.action_path)) }}
        restore-keys: |
          ${{ runner.os }}-pip-leftsize-
    
    - name: Install dependencies
      shell: bash
      run: |
        pip install --quiet --disable-pip-version-check -r "${{ github.action_path }}/requirements.txt"
    
    - name: Run LeftSize
      id: run
      shell: bash
      env:
        LEFTSIZE_MODE: ${{ inputs.mode }}
        LEFTSIZE_INSTALLATION_ID: ${{ inputs.installation-id }}
        LEFTSIZE_REPOSITORY_TOKEN: ${{ inputs.repository-token }}
        LEFTSIZE_BACKEND_URL: ${{ inputs.backend-url }}
        LEFTSIZE_PERIOD: ${{ inputs.period }}
        LEFTSIZE_FORMAT: ${{ inputs.format }}
        LEFTSIZE_REPORT: ${{ inputs.report }}
        LEFTSIZE_CLOUD_PROVIDER: ${{ inputs.cloud-provider }}
        LEFTSIZE_AZURE_SUBSCRIPTION_IDS: ${{ inputs.azure-subscription-ids }}
        LEFTSIZE_AWS_REGIONS: ${{ inputs.aws-regions }}
        LEFTSIZE_CLOUDFLARE_ACCOUNT_IDS: ${{ inputs.cloudflare-account-ids }}
        LEFTSIZE_CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        LEFTSIZE_ENVIRONMENT_NAME: ${{ inputs.environment-name }}
        LEFTSIZE_CURRENCY: ${{ inputs.currency }}
        LEFTSIZE_INCLUDE_POLICIES: ${{ inputs.include-policies }}
        LEFTSIZE_EXCLUDE_POLICIES: ${{ inputs.exclude-policies }}
        LEFTSIZE_VERBOSE: ${{ inputs.verbose }}
      run: |
        MODE="${LEFTSIZE_MODE:-scan}"
        
        if [ "$MODE" = "stats" ]; then
          echo "::group::LeftSize Statistics Report"
          echo "Mode: stats"
          echo "Period: ${LEFTSIZE_PERIOD}"
          echo "Format: ${LEFTSIZE_FORMAT}"
          echo "Report: ${LEFTSIZE_REPORT}"
          echo "::endgroup::"
        else
          echo "::group::LeftSize Cloud Cost Optimization Scanner"
          echo "Mode: scan"
          echo "Cloud Provider: ${LEFTSIZE_CLOUD_PROVIDER}"
          echo "::endgroup::"
        fi
        
        # Run the Python runner (GitHub runs this shell with -e, so test the exit code directly)
        if python3 "${{ github.action_path }}/run.py"; then
          echo "✅ LeftSize $MODE completed successfully"
        else
          EXIT_CODE=$?
          echo "❌ LeftSize failed with exit code $EXIT_CODE"
          exit $EXIT_CODE
        fi
